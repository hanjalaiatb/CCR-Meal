<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCR</title>
<style>
*,*:before,*:after{box-sizing:border-box}
body{font-family:sans-serif;margin:0;padding:4px;font-size:18px;background:#f8fafc;color:#0f172a}
.card{border:1px solid #cbd5e1;border-radius:14px;padding:8px;margin-bottom:6px;background:#fff;width:100%;overflow:hidden}
body > .card:nth-child(1){background:#e0f2fe}
body > .card:nth-child(2){background:#dcfce7}
body > .card:nth-child(3){background:#fee2e2}
h2{font-size:19px;margin:0 0 6px;border-bottom:1px solid #cbd5e1;padding-bottom:3px;display:flex;justify-content:space-between;color:#1e293b}
label{display:block;font-size:16px;font-weight:bold;margin:4px 0 2px;color:#334155}
input,select{width:100%;height:38px;padding:0 10px;border:1px solid #cbd5e1;border-radius:10px;font-size:18px;background:#fff;color:#0f172a}
.date-wrap{position:relative;width:100%;background:#fff;border:1px solid #cbd5e1;border-radius:10px;height:38px;display:flex;align-items:center}
.date-wrap input[type="date"]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2;border:none;background:transparent}
.date-display{width:100%;padding:0 36px 0 10px;font-size:18px;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.date-wrap::after{content:"";position:absolute;right:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>") no-repeat center;pointer-events:none}
input:focus,select:focus{outline:none;border-color:#d97706}
.date-wrap:focus-within{border-color:#d97706;outline:none}
.row{display:flex;gap:4px;width:100%}
.row>div{flex:1;min-width:0}
.grid3,.grid4{display:flex;gap:4px}
.grid4{gap:3px}
.seg{display:flex;align-items:stretch;justify-content:stretch;border:1px solid #cbd5e1;border-radius:10px;overflow:hidden;background:#f1f5f9;height:40px;flex:1;min-width:0}
.rl{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;cursor:pointer;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0;margin:0}
.rl input{display:none}
.rl.active-shift{background:#0369a1;color:#fff}
.rl.active-meal{background:#0284c7;color:#fff}
.rl.active-menu{background:#38bdf8;color:#0f172a}
.rl.dis{opacity:0.3;pointer-events:none;background:#e2e8f0}
.btn{width:100%;height:42px;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;background:#d97706;color:#fff;margin-top:8px}
.btn-del{background:#e11d48}
.btn-g{background:#059669;color:#fff;border:none;border-radius:8px;height:38px;padding:0 8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:6px}
.tabs{display:flex;gap:3px;margin-top:6px}
.tbtn{flex:1;background:#f1f5f9;border:1px solid #cbd5e1;font-weight:bold;font-size:16px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;color:#475569}
.tbtn.active{background:#0284c7;color:#fff;border-color:#0284c7}
.panel{border:1px solid #cbd5e1;border-radius:10px;padding:12px 8px 8px 8px;display:none;background:#fff;margin-top:4px}
.panel.show{display:block}
.sblk{margin-top:10px;padding-top:10px;border-top:1px dashed #cbd5e1;font-size:18px}
.sblk:first-child{margin-top:0;padding-top:0;border-top:none}
.tpre{font-family:monospace;background:#f8fafc;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:18px;white-space:pre-wrap;margin-top:4px;line-height:1.4}
.msg{padding:6px;font-size:16px;margin-bottom:4px;font-weight:bold;display:none;border-radius:10px}
.err{background:#ffe4e6;color:#9f1239;border:1px solid #fecdd3}
.suc{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.chk{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:bold;height:30px;color:#334155}
.chk input{width:16px;height:16px}
</style>
</head>
<body>

<div class="card">
<h2>Meal Entry</h2>
<div id="e-msg" class="msg"></div>
<form id="f-meal">
<label>Employee ID(s)</label>
<input type="text" id="e-id" required>
<label class="chk"><input type="checkbox" id="e-multiple"> Multiple Days</label>
<div class="row">
<div>
  <label id="e-ldt">Start Date</label>
  <div class="date-wrap">
    <span class="date-display" id="e-start-disp"></span>
    <input type="date" id="e-start" required>
  </div>
</div>
<div id="e-ew" style="display:none">
  <label>End Date</label>
  <div class="date-wrap">
    <span class="date-display" id="e-end-disp"></span>
    <input type="date" id="e-end">
  </div>
</div>
</div>

<label>Shift</label>
<div class="grid3" id="g-shift">
<div class="seg"><label class="rl active-shift"><input type="radio" name="shift" value="Morning" checked>Morning</label></div>
<div class="seg"><label class="rl"><input type="radio" name="shift" value="Afternoon">Afternoon</label></div>
<div class="seg"><label class="rl"><input type="radio" name="shift" value="Night">Night</label></div>
</div>

<label>Meal Type</label>
<div class="grid3" id="g-meal">
<div class="seg"><label class="rl active-meal"><input type="radio" name="meal" value="Breakfast" checked>Breakfast</label></div>
<div class="seg"><label class="rl"><input type="radio" name="meal" value="Lunch">Lunch</label></div>
<div class="seg"><label class="rl"><input type="radio" name="meal" value="Dinner">Dinner</label></div>
</div>

<label>Menu Option</label>
<div class="grid4" id="g-menu">
<div class="seg"><label class="rl active-menu" id="l-reg"><input type="radio" name="menuOption" value="Regular" checked>Reg</label></div>
<div class="seg"><label class="rl dis" id="l-fri"><input type="radio" name="menuOption" value="Fried Egg" disabled>Fried</label></div>
<div class="seg"><label class="rl dis" id="l-poa"><input type="radio" name="menuOption" value="Poached Egg" disabled>Poached</label></div>
<div class="seg"><label class="rl dis" id="l-mut"><input type="radio" name="menuOption" value="Mutton" disabled>Mutton</label></div>
</div>

<button type="submit" class="btn">Save</button>
</form>
</div>

<div class="card">
<h2><span>Summary Output</span> <span id="s-lbl" style="font-size:16px;color:#0284c7"></span></h2>
<label>Select Date</label>
<div class="date-wrap">
  <span class="date-display" id="s-date-disp"></span>
  <input type="date" id="s-date" required>
</div>
<div class="tabs" id="tab-row"></div>
<div class="panel show" id="p-Breakfast"></div>
<div class="panel" id="p-Lunch"></div>
<div class="panel" id="p-Dinner"></div>
</div>

<div class="card">
<h2>Delete Record</h2>
<div id="d-msg" class="msg"></div>
<form id="f-del">
<label>ID(s)</label>
<input type="text" id="d-id" required>
<label class="chk"><input type="checkbox" id="d-multiple"> Multiple Days</label>
<div class="row">
<div>
  <label id="d-ldt">Start Date</label>
  <div class="date-wrap">
    <span class="date-display" id="d-start-disp"></span>
    <input type="date" id="d-start" required>
  </div>
</div>
<div id="e-ew2" style="display:none">
  <label>End Date</label>
  <div class="date-wrap">
    <span class="date-display" id="d-end-disp"></span>
    <input type="date" id="d-end">
  </div>
</div>
</div>
<label>Meal</label>
<select id="d-meal"><option value="Breakfast">Breakfast</option><option value="Lunch">Lunch</option><option value="Dinner">Dinner</option></select>
<button type="submit" class="btn btn-del">Delete Record</button>
</form>
</div>

<script>
const cache={},gB=()=>{const d=new Date(),b=new Date(d.getTime()+(d.getTimezoneOffset()*60000)+21600000);return`${b.getFullYear()}-${String(b.getMonth()+1).padStart(2,'0')}-${String(b.getDate()).padStart(2,'0')}`;},today=gB();
const fmt=s=>s?s.split('-').reverse().join('/'):'',bn=n=>String(n).replace(/\d/g,d=>['০','১','২','৩','৪','৫','৬','৭','৮','৯'][d]);

function updateDisp(id){
    const inp=document.getElementById(id),disp=document.getElementById(id+'-disp');
    if(inp&&disp&&inp.value){
        const p=inp.value.split('-');
        if(p.length===3)disp.innerText=`${parseInt(p[2],10)} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(p[1],10)-1]} ${p[0]}`;
    }
}

['s-date','e-start','e-end','d-start','d-end'].forEach(id=>{
    document.getElementById(id).value=today;
    updateDisp(id);
});

const sid=localStorage.getItem('ccr_id')||'';
['e-id','d-id'].forEach(id=>{
    document.getElementById(id).value=sid;
    document.getElementById(id).addEventListener('input',e=>{const f=e.target.value.split(',')[0].trim();if(f)localStorage.setItem('ccr_id',f);});
});

[['e-multiple','e-ew','e-ldt','e-start','e-end'],['d-multiple','e-ew2','d-ldt','d-start','d-end']].forEach(x=>{
    document.getElementById(x[0]).addEventListener('change',e=>{
        const m=e.target.checked;
        document.getElementById(x[1]).style.display=m?'block':'none';
        document.getElementById(x[2]).innerText=m?'Start Date':'Date';
        if(!m){document.getElementById(x[4]).value=document.getElementById(x[3]).value;updateDisp(x[4]);}
    });
});

document.getElementById('e-start').addEventListener('change',e=>{
    if(!document.getElementById('e-multiple').checked){document.getElementById('e-end').value=e.target.value;updateDisp('e-end');}
    document.getElementById('s-date').value=e.target.value;updateDisp('s-date');
    loadSum();
});
document.getElementById('d-start').addEventListener('change',e=>{
    if(!document.getElementById('d-multiple').checked){document.getElementById('d-end').value=e.target.value;updateDisp('e-end');}
});

let actM='Breakfast';
function msg(id,txt,t){
    const el=document.getElementById(id);
    el.className='msg '+(t==='s'?'suc':'err');
    el.innerText=txt;
    el.style.display='block';
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(()=>el.style.display='none',4000);
}

function checkCutoff(dtStr, mealType) {
    const dNow = new Date(), bdtNow = new Date(dNow.getTime() + (dNow.getTimezoneOffset() * 60000) + 21600000);
    const todayIso = `${bdtNow.getFullYear()}-${String(bdtNow.getMonth() + 1).padStart(2, '0')}-${String(bdtNow.getDate()).padStart(2, '0')}`;
    const timeMin = bdtNow.getHours() * 60 + bdtNow.getMinutes();

    if (dtStr < todayIso) return 'Rejected: Past date ' + dtStr + '!';
    if ((bdtNow - new Date(dtStr)) / 3600000 > 48) return 'Rejected: Past 48 hours for ' + dtStr + '!';
    if (dtStr === todayIso) {
        if (mealType === 'Breakfast' && timeMin > 435) return 'Cutoff: Breakfast closed at 7:15 AM!';
        if (mealType === 'Lunch' && timeMin > 720) return 'Cutoff: Lunch closed at 12:00 PM!';
        if (mealType === 'Dinner' && timeMin > 1140) return 'Cutoff: Dinner closed at 7:00 PM!';
    }
    return null;
}

document.getElementById('g-shift').addEventListener('change',e=>{if(!e.target.disabled){document.querySelectorAll('#g-shift .rl').forEach(l=>l.classList.remove('active-shift'));e.target.closest('.rl').classList.add('active-shift');}});
document.getElementById('g-meal').addEventListener('change',e=>{if(!e.target.disabled){document.querySelectorAll('#g-meal .rl').forEach(l=>l.classList.remove('active-meal'));e.target.closest('.rl').classList.add('active-meal');}});
document.getElementById('g-menu').addEventListener('change',e=>{if(!e.target.disabled){document.querySelectorAll('#g-menu .rl').forEach(l=>l.classList.remove('active-menu'));e.target.closest('.rl').classList.add('active-menu');}});

document.querySelectorAll('input[name="meal"]').forEach(inp=>{
    inp.addEventListener('change',e=>{
        const isB=e.target.value==='Breakfast';
        ['Fried Egg','Poached Egg','Mutton'].forEach(v=>{
            const el=document.querySelector(`input[value="${v}"]`);
            if(el){el.disabled=isB;el.closest('.rl').classList.toggle('dis',isB);}
        });
        if(isB){
            document.querySelector('input[value="Regular"]').checked=true;
            document.querySelectorAll('#g-menu .rl').forEach(l=>l.classList.remove('active-menu'));
            document.getElementById('l-reg').classList.add('active-menu');
        }
    });
});

async function loadSum(pref){
    if(pref)actM=pref;
    const dt=document.getElementById('s-date').value;
    if(!dt)return;
    document.getElementById('s-lbl').innerText=(dt===today)?'(Today)':"";

    try{
        let recs=cache[dt];
        if(!recs){
            const res=await fetch('/api/summary?dateStr='+dt);
            const data=await res.json();
            recs=data.records||[];
            cache[dt]=recs;
        }

        const meals=['Breakfast','Lunch','Dinner'];
        let tHtml='';
        meals.forEach(m=>{
            const cnt=recs.filter(r=>r.meal===m).length;
            tHtml+=`<button type="button" class="tbtn ${m===actM?'active':''}" onclick="swT('${m}')">${m} (${cnt})</button>`;
        });
        document.getElementById('tab-row').innerHTML=tHtml;

        meals.forEach(m=>{
            const panel=document.getElementById('p-'+m);
            panel.classList.toggle('show',m===actM);
            const mRecs=recs.filter(r=>r.meal===m);

            if(!mRecs.length){
                panel.innerHTML='<div style="text-align:center;padding:8px;font-weight:bold;font-size:18px;color:#64748b">No entries found</div>';
                return;
            }

            mRecs.sort((a, b) => Number(a.id) - Number(b.id));

            let body='';
            ['Morning','Afternoon','Night'].forEach(sh=>{
                const sRecs=mRecs.filter(r=>r.shift===sh);
                if(!sRecs.length)return;

                const f=sRecs.filter(r=>r.menuOption==='Fried Egg').length;
                const p=sRecs.filter(r=>r.menuOption==='Poached Egg').length;
                const mu=sRecs.filter(r=>r.menuOption==='Mutton').length;
                let cStr='Total:'+sRecs.length;
                if(f)cStr+=', F-'+f;
                if(p)cStr+=', P-'+p;
                if(mu)cStr+=', M-'+mu;
                
                const ids=sRecs.map(r=>{
                    let tag='';
                    if(r.menuOption==='Poached Egg') tag='(P)';
                    else if(r.menuOption==='Fried Egg') tag='(F)';
                    else if(r.menuOption==='Mutton') tag='(M)';
                    return r.id+tag;
                }).join(', ');

                body+=`<div class="sblk"><div style="font-weight:bold;font-size:18px;color:#1e293b">${sh} Shift (${cStr})</div><div style="font-size:18px;color:#475569;margin-top:4px">ID: ${ids}</div></div>`;
            });

            const tw=m==='Breakfast'?'সকালে':(m==='Lunch'?'দুপুরে':'রাতে');
            let wa=`${fmt(dt)}\n${tw} মোট ${bn(mRecs.length)} জনের খাবার CCR এ আসবে।\nID: ${mRecs.map(r=>r.id).join(', ')}\n`;
            
            ['Fried Egg','Poached Egg','Mutton'].forEach(opt=>{
                const sub=mRecs.filter(r=>r.menuOption===opt);
                if(sub.length){
                    wa+=`${opt==='Fried Egg'?'ডিম ভাজি':(opt==='Poached Egg'?'ডিম পোচ':'খাসি (নন-মুসলিম)')}: ${bn(sub.length)} টা (${sub.map(r=>r.id).join(', ')})\n`;
                }
            });

            body+=`<div class="tpre" id="wa-${m}">${wa.trimEnd().replace(/\.$/g,'。')}</div>`+
                    `<button type="button" class="btn-g" onclick="navigator.clipboard.writeText(document.getElementById('wa-${m}').innerText)">📋 Copy WhatsApp</button>`;
            panel.innerHTML=body;
        });
    }catch(e){console.error(e);}
}

window.swT=function(m){
    actM=m;
    document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active',b.textContent.startsWith(m)));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('show',p.id==='p-'+m));
};

document.getElementById('f-meal').addEventListener('submit',async e=>{
    e.preventDefault();
    const start=document.getElementById('e-start').value,end=document.getElementById('e-multiple').checked?document.getElementById('e-end').value:start;
    if(!start||!end)return msg('e-msg','Error: Invalid date range.','e');

    const mealType=document.querySelector('input[name="meal"]:checked').value;
    const shift=document.querySelector('input[name="shift"]:checked').value;
    const menuOpt=document.querySelector('input[name="menuOption"]:checked').value;
    const ids=document.getElementById('e-id').value.split(',').map(i=>i.trim()).filter(Boolean);
    if(!ids.length)return msg('e-msg','Error: Enter at least one Employee ID.','e');

    let curr=new Date(start),last=new Date(end);
    while(curr<=last){
        const dtStr=curr.toISOString().split('T')[0];
        const err=checkCutoff(dtStr, mealType);
        if(err)return msg('e-msg',err,'e');
        curr.setDate(curr.getDate()+1);
    }

    if(ids[0])localStorage.setItem('ccr_id',ids[0]);
    let mod=0,exist=0,added=0;
    curr=new Date(start);
    while(curr<=last){
        const dtStr=curr.toISOString().split('T')[0];
        delete cache[dtStr];
        const res=await fetch('/api/summary?dateStr='+dtStr);
        const data=await res.json();
        const dayRecs=data.records||[];

        for(let i=0;i<ids.length;i++){
            const id=ids[i],ex=dayRecs.find(r=>r.id===id&&r.meal===mealType);
            if(ex){if(ex.shift===shift&&ex.menuOption===menuOpt)exist++;else mod++;}else added++;

            await fetch('/api/submit',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({dateStr:dtStr,id,shift,meal:mealType,menuOption:menuOpt})
            });
        }
        curr.setDate(curr.getDate()+1);
    }

    document.getElementById('s-date').value=start;
    updateDisp('s-date');
    let parts=[];
    if(added)parts.push(added+' added');
    if(mod)parts.push(mod+' modified');
    if(exist)parts.push(exist+' already existed');
    msg('e-msg','Success: '+parts.join(' | ')+'.',(mod||added)?'s':'e');
    loadSum(mealType);
});

document.getElementById('f-del').addEventListener('submit',async e=>{
    e.preventDefault();
    const start=document.getElementById('d-start').value,end=document.getElementById('d-multiple').checked?document.getElementById('d-end').value:start;
    if(!start||!end)return msg('d-msg','Error: Invalid date range.','e');

    const ids=document.getElementById('d-id').value.split(',').map(i=>i.trim()).filter(Boolean);
    const mealVal=document.getElementById('d-meal').value;
    if(!ids.length)return msg('d-msg','Error: Enter at least one ID.','e');

    let curr=new Date(start),last=new Date(end);
    while(curr<=last){
        const dtStr=curr.toISOString().split('T')[0];
        const err=checkCutoff(dtStr, mealVal);
        if(err)return msg('d-msg',err,'e');
        curr.setDate(curr.getDate()+1);
    }

    if(ids[0])localStorage.setItem('ccr_id',ids[0]);
    curr=new Date(start);
    while(curr<=last){
        const dtStr=curr.toISOString().split('T')[0];
        delete cache[dtStr];
        for(let i=0;i<ids.length;i++){
            await fetch('/api/delete',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({id:ids[i],dateStr:dtStr,meal:mealVal})
            });
        }
        curr.setDate(curr.getDate()+1);
    }
    document.getElementById('s-date').value=start;
    updateDisp('s-date');
    msg('d-msg','Success: Record(s) deleted!','s');
    loadSum(mealVal);
});

['s-date','e-start','e-end','d-start','d-end'].forEach(id=>{
    document.getElementById(id).addEventListener('change',()=>{
        updateDisp(id);
        if(id==='s-date') loadSum();
    });
});
loadSum();
</script>
</body>
</html>
