<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR Meal System</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 4px; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 4px; }
        .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px; }
        h2 { font-size: 0.8rem; font-weight: 700; margin: 0 0 2px 0; color: #1e293b; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 3px; }
        label { display: block; font-size: 0.55rem; font-weight: 600; color: #64748b; margin-bottom: 1px; text-transform: uppercase; }
        input, select { width: 100%; height: 26px; padding: 2px 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.7rem; background: #f8fafc; box-sizing: border-box; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
        .radio-lbl { display: flex; align-items: center; justify-content: center; height: 26px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.6rem; font-weight: 600; cursor: pointer; color: #64748b; }
        .radio-lbl input { display: none; }
        .radio-lbl.active { background: #eff6ff; border-color: #2563eb; color: #2563eb; }
        .radio-lbl.disabled { opacity: 0.3; background: #f1f5f9; pointer-events: none; }
        button { width: 100%; height: 26px; border: none; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; margin-top: 2px; }
        .btn-blue { background: #2563eb; color: #fff; }
        .btn-red { background: #ef4444; color: #fff; }
        .btn-green { background: #059669; color: #fff; height: 22px; padding: 0 6px; font-size: 0.6rem; width: auto; margin-top: 2px; display: inline-block; }
        .acc { border: 1px solid #cbd5e1; border-radius: 4px; margin-top: 3px; overflow: hidden; }
        .acc-btn { width: 100%; padding: 4px 6px; background: #f8fafc; border: none; display: flex; justify-content: space-between; font-weight: 700; color: #2563eb; font-size: 0.7rem; cursor: pointer; }
        .acc-body { display: none; padding: 4px; border-top: 1px solid #cbd5e1; font-size: 0.65rem; }
        .acc-body.show { display: block; }
        .shift-blk { margin-top: 2px; padding-top: 2px; border-top: 1px dashed #cbd5e1; }
        .txt-pre { font-family: monospace; background: #f8fafc; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.6rem; white-space: pre-wrap; word-break: break-all; margin-top: 2px; }
        .field-group { margin-bottom: 3px; }
        .msg-box { padding: 4px; border-radius: 4px; font-size: 0.65rem; margin-bottom: 3px; display: none; }
        .err-msg { background: #fee2e2; color: #991b1b; }
        .suc-msg { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>

<div class="box">
    <div class="card">
        <h2>Meal Entry</h2>
        <div id="e-msg" class="msg-box"></div>
        <form id="f-meal">
            <div class="field-group"><label>Employee ID(s) [e.g. 235,236]</label><input type="text" id="e-id" required></div>
            <div class="row">
                <div><label>Start Date (DD/MM/YYYY)</label><input type="text" id="e-start-date" placeholder="DD/MM/YYYY" required></div>
                <div><label>End Date (DD/MM/YYYY)</label><input type="text" id="e-end-date" placeholder="DD/MM/YYYY" required></div>
            </div>
            <div class="field-group"><label>Shift</label>
                <div class="grid-3" id="g-shift">
                    <label class="radio-lbl active"><input type="radio" name="shift" value="Morning" checked>Morning</label>
                    <label class="radio-lbl"><input type="radio" name="shift" value="Afternoon">Afternoon</label>
                    <label class="radio-lbl"><input type="radio" name="shift" value="Night">Night</label>
                </div>
            </div>
            <div class="field-group"><label>Meal Type</label>
                <div class="grid-3" id="g-meal">
                    <label class="radio-lbl active"><input type="radio" name="meal" value="Breakfast" checked>Breakfast</label>
                    <label class="radio-lbl"><input type="radio" name="meal" value="Lunch">Lunch</label>
                    <label class="radio-lbl"><input type="radio" name="meal" value="Dinner">Dinner</label>
                </div>
            </div>
            <div class="field-group"><label>Menu Option</label>
                <div class="grid-4" id="g-menu">
                    <label class="radio-lbl active" id="lbl-reg"><input type="radio" name="menuOption" value="Regular" checked>Reg</label>
                    <label class="radio-lbl disabled" id="lbl-fried"><input type="radio" name="menuOption" value="Fried Egg" disabled>Fried</label>
                    <label class="radio-lbl disabled" id="lbl-poached"><input type="radio" name="menuOption" value="Poached Egg" disabled>Poached</label>
                    <label class="radio-lbl disabled" id="lbl-mutton"><input type="radio" name="menuOption" value="Mutton" disabled>Mutton</label>
                </div>
            </div>
            <button type="submit" class="btn-blue">Save Entry</button>
        </form>
    </div>

    <div class="card">
        <h2>Summary Output</h2>
        <div style="max-width:130px; margin-bottom:3px;"><label>Select Date (DD/MM/YYYY)</label><input type="text" id="s-date" placeholder="DD/MM/YYYY"></div>
        <div id="summary-box"></div>
    </div>

    <div class="card">
        <h2>Delete Record</h2>
        <div id="d-msg" class="msg-box"></div>
        <form id="f-del">
            <div class="field-group"><label>ID(s) [e.g. 235,236]</label><input type="text" id="d-id" required></div>
            <div class="row">
                <div><label>Start Date (DD/MM/YYYY)</label><input type="text" id="d-start-date" placeholder="DD/MM/YYYY" required></div>
                <div><label>End Date (DD/MM/YYYY)</label><input type="text" id="d-end-date" placeholder="DD/MM/YYYY" required></div>
            </div>
            <div class="field-group"><label>Meal</label><select id="d-meal"><option value="Breakfast">Breakfast</option><option value="Lunch">Lunch</option><option value="Dinner">Dinner</option></select></div>
            <button type="submit" class="btn-red" style="margin-top:3px;">Delete</button>
        </form>
    </div>
</div>

<script>
    function formatDateToDMY(dateObj) {
        const d = String(dateObj.getDate()).padStart(2, '0');
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const y = dateObj.getFullYear();
        return `${d}/${m}/${y}`;
    }

    function parseDMYToISO(str) {
        if (!str) return '';
        const parts = str.trim().split('/');
        if (parts.length !== 3) return '';
        const [d, m, y] = parts;
        if (d.length !== 2 || m.length !== 2 || y.length !== 4) return '';
        return `${y}-${m}-${d}`;
    }

    function toBengaliNum(num) {
        const engToBen = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
        return String(num).replace(/[0-9]/g, w => engToBen[w]);
    }

    const todayObj = new Date();
    const todayDMY = formatDateToDMY(todayObj);

    ['e-start-date', 'e-end-date', 's-date', 'd-start-date', 'd-end-date'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.value = todayDMY;
    });

    let msgTimeouts = {};
    function showMessage(elementId, text, type) {
        const msgDiv = document.getElementById(elementId);
        if (!msgDiv) return;
        
        if (msgTimeouts[elementId]) {
            clearTimeout(msgTimeouts[elementId]);
        }

        msgDiv.className = `msg-box ${type === 'success' ? 'suc-msg' : 'err-msg'}`;
        msgDiv.innerText = text;
        msgDiv.style.display = 'block';

        msgTimeouts[elementId] = setTimeout(() => {
            msgDiv.style.display = 'none';
        }, 10000);
    }

    function setupRadios(id) {
        const container = document.getElementById(id);
        container.addEventListener('change', e => {
            if (e.target.disabled) return;
            container.querySelectorAll('.radio-lbl').forEach(l => l.classList.remove('active'));
            e.target.closest('.radio-lbl').classList.add('active');
        });
    }
    setupRadios('g-shift'); setupRadios('g-meal'); setupRadios('g-menu');

    document.querySelectorAll('input[name="meal"]').forEach(inp => {
        inp.addEventListener('change', e => {
            const isB = e.target.value === 'Breakfast';
            ['Fried Egg', 'Poached Egg', 'Mutton'].forEach(val => {
                const el = document.querySelector(`input[value="${val}"]`);
                if (el) {
                    el.disabled = isB;
                    el.closest('.radio-lbl').classList.toggle('disabled', isB);
                }
            });
            if (isB) {
                document.querySelector('input[value="Regular"]').checked = true;
                document.querySelectorAll('#g-menu .radio-lbl').forEach(l => l.classList.remove('active'));
                document.getElementById('lbl-reg').classList.add('active');
            }
        });
    });

    function checkDeadline(meal, targetISOStr) {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const dhakaTime = new Date(utc + (3600000 * 6));
        
        const currentY = dhakaTime.getFullYear();
        const currentM = String(dhakaTime.getMonth() + 1).padStart(2, '0');
        const currentD = String(dhakaTime.getDate()).padStart(2, '0');
        const todayDhakaStr = `${currentY}-${currentM}-${currentD}`;

        if (targetISOStr !== todayDhakaStr) return null;

        const currentHours = dhakaTime.getHours();
        const currentMinutes = dhakaTime.getMinutes();
        const totalMinutes = currentHours * 60 + currentMinutes;

        if (meal === 'Breakfast') {
            if (totalMinutes > 435) return "Breakfast entry is closed after 7:15 AM for today.";
        } else if (meal === 'Lunch') {
            if (totalMinutes > 660) return "Lunch entry is closed after 11:00 AM for today.";
        } else if (meal === 'Dinner') {
            if (totalMinutes > 1140) return "Dinner entry is closed after 7:00 PM for today.";
        }
        return null;
    }

    async function loadSummary(openMeal = null) {
        const dateInput = document.getElementById('s-date');
        const dateDMY = dateInput ? dateInput.value : todayDMY;
        const dateStr = parseDMYToISO(dateDMY);
        if (!dateStr) return;
        
        try {
            const res = await fetch(`/api/summary?dateStr=${dateStr}`);
            const data = await res.json();
            const records = (data.records || []).sort((a, b) => (Number(a.id) || 0) - (Number(b.id) || 0));
            
            const box = document.getElementById('summary-box');
            if(!box) return;

            box.innerHTML = ['Breakfast', 'Lunch', 'Dinner'].map(meal => {
                const mRecs = records.filter(r => r.meal === meal);
                const isOpen = meal === openMeal;
                return `<div class="acc">
                    <button type="button" class="acc-btn" onclick="toggleAcc('${meal}')"><span>${meal}</span><span>Total: ${mRecs.length} ${isOpen ? '▲' : '▼'}</span></button>
                    <div class="acc-body ${isOpen ? 'show' : ''}" id="acc-${meal}">
                        ${mRecs.length === 0 ? '<div>No entries found.</div>' : 
                            ['Morning', 'Afternoon', 'Night'].map(shift => {
                                const sRecs = mRecs.filter(r => r.shift === shift);
                                if (!sRecs.length) return '';
                                const fCount = sRecs.filter(r => r.menuOption === 'Fried Egg').length;
                                const pCount = sRecs.filter(r => r.menuOption === 'Poached Egg').length;
                                const mCount = sRecs.filter(r => r.menuOption === 'Mutton').length;
                                
                                let countsStr = `Total: ${sRecs.length}`;
                                if (fCount > 0) countsStr += `, F-${fCount}`;
                                if (pCount > 0) countsStr += `, P-${pCount}`;
                                if (mCount > 0) countsStr += `, M-${mCount}`;

                                const ids = sRecs.map(r => r.id + (r.menuOption === 'Poached Egg' ? '(P)' : r.menuOption === 'Fried Egg' ? '(F)' : r.menuOption === 'Mutton' ? '(M)' : '')).join(', ');
                                return `<div class="shift-blk"><div style="font-weight:700">${shift} shift (${countsStr})</div><div>Meal ID: ${ids}</div></div>`;
                            }).join('') +
                            (() => {
                                let timeWord = (meal === 'Breakfast') ? 'সকালে' : (meal === 'Lunch' ? 'দুপুরে' : 'রাতে');
                                const totalBen = toBengaliNum(mRecs.length);
                                let waText = `${dateDMY}\n${timeWord} মোট ${totalBen} জনের খাবার CCR এ আসবে।\nID: ${mRecs.map(r => r.id).join(', ')}`;
                                
                                const fried = mRecs.filter(r => r.menuOption === 'Fried Egg');
                                if (fried.length > 0) waText += `\nডিম ভাজি: ${toBengaliNum(fried.length)} টা (${fried.map(r => r.id).join(', ')})`;
                                
                                const poached = mRecs.filter(r => r.menuOption === 'Poached Egg');
                                if (poached.length > 0) waText += `\nডিম পোচ: ${toBengaliNum(poached.length)} টা (${poached.map(r => r.id).join(', ')})`;
                                
                                const mutton = mRecs.filter(r => r.menuOption === 'Mutton');
                                if (mutton.length > 0) waText += `\nখাসি (নন-মুসলিম): ${toBengaliNum(mutton.length)} টা (${mutton.map(r => r.id).join(', ')})`;

                                return `<div class="txt-pre" id="wa-${meal}">${waText}</div>
                                <button type="button" class="btn-green" onclick="navigator.clipboard.writeText(document.getElementById('wa-${meal}').innerText)">Copy WhatsApp Format</button>`;
                            })()
                        }
                    </div></div>`;
            }).join('');
        } catch (err) {
            console.error(err);
        }
    }

    window.toggleAcc = function(meal) {
        const el = document.getElementById(`acc-${meal}`);
        if(!el) return;
        const wasOpen = el.classList.contains('show');
        document.querySelectorAll('.acc-body').forEach(b => b.classList.remove('show'));
        if (!wasOpen) el.classList.add('show');
    };

    document.getElementById('f-meal').addEventListener('submit', async e => {
        e.preventDefault();

        const startDMY = document.getElementById('e-start-date').value;
        const endDMY = document.getElementById('e-end-date').value;
        const startISO = parseDMYToISO(startDMY);
        const endISO = parseDMYToISO(endDMY);

        if (!startISO || !endISO) {
            showMessage('e-msg', 'Invalid date format. Use DD/MM/YYYY.', 'error');
            return;
        }

        const startDate = new Date(startISO);
        const endDate = new Date(endISO);

        if (startDate > endDate) {
            showMessage('e-msg', 'Start date cannot be after end date.', 'error');
            return;
        }

        const mealType = document.querySelector('input[name="meal"]:checked').value;

        const deadlineError = checkDeadline(mealType, startISO);
        if (deadlineError) {
            showMessage('e-msg', deadlineError, 'error');
            return;
        }

        const rawIds = document.getElementById('e-id').value.split(',');
        const ids = rawIds.map(i => i.trim()).filter(i => i.length > 0);
        if (ids.length === 0) return;

        const shiftVal = document.querySelector('input[name="shift"]:checked').value;
        const menuVal = document.querySelector('input[name="menuOption"]:checked').value;

        let currDate = new Date(startDate);
        while (currDate <= endDate) {
            const dateStr = currDate.toISOString().split('T')[0];

            for (let id of ids) {
                await fetch('/api/submit', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({
                        dateStr: dateStr,
                        id: id,
                        shift: shiftVal,
                        meal: mealType,
                        menuOption: menuVal
                    }) 
                });
            }
            currDate.setDate(currDate.getDate() + 1);
        }

        document.getElementById('e-id').value = '';
        document.getElementById('s-date').value = startDMY;
        
        showMessage('e-msg', `Successfully registered meal entries for ID(s): ${ids.join(', ')} from ${startDMY} to ${endDMY}`, 'success');

        loadSummary(mealType);
    });

    document.getElementById('f-del').addEventListener('submit', async e => {
        e.preventDefault();

        const startDMY = document.getElementById('d-start-date').value;
        const endDMY = document.getElementById('d-end-date').value;
        const startISO = parseDMYToISO(startDMY);
        const endISO = parseDMYToISO(endDMY);

        if (!startISO || !endISO) {
            showMessage('d-msg', 'Invalid date format. Use DD/MM/YYYY.', 'error');
            return;
        }

        const startDate = new Date(startISO);
        const endDate = new Date(endISO);

        if (startDate > endDate) {
            showMessage('d-msg', 'Start date cannot be after end date.', 'error');
            return;
        }

        const rawIds = document.getElementById('d-id').value.split(',');
        const ids = rawIds.map(i => i.trim()).filter(i => i.length > 0);
        if (ids.length === 0) return;

        const mealVal = document.getElementById('d-meal').value;

        let currDate = new Date(startDate);
        while (currDate <= endDate) {
            const dateStr = currDate.toISOString().split('T')[0];

            for (let id of ids) {
                await fetch('/api/delete', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: id, dateStr: dateStr, meal: mealVal })
                });
            }
            currDate.setDate(currDate.getDate() + 1);
        }

        document.getElementById('d-id').value = '';
        document.getElementById('s-date').value = startDMY;

        showMessage('d-msg', `Successfully deleted records for ID(s): ${ids.join(', ')} from ${startDMY} to ${endDMY}`, 'success');

        loadSummary(mealVal);
    });

    document.getElementById('e-start-date').addEventListener('input', e => {
        document.getElementById('s-date').value = e.target.value;
        loadSummary();
    });
    document.getElementById('s-date').addEventListener('input', () => loadSummary());

    loadSummary();
</script>
</body>
</html>
