<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #f1f5f9; color: #1e293b; margin: 0; padding: 4px; font-size: 15px; }
        .box { max-width: 360px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
        .card { border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        h2 { font-size: 15px; margin: 0 0 6px 0; font-weight: 700; color: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 3px; color: #334155; }
        input, select { width: 100%; height: 38px; padding: 0 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 15px; background: #fff; color: #0f172a; outline: none; }
        input:focus, select:focus { border-color: #0284c7; box-shadow: 0 0 0 2px rgba(2,132,199,0.15); }
        .field-group { margin-bottom: 6px; }
        .row { display: flex; gap: 6px; margin-bottom: 6px; }
        .row > div { flex: 1; }
        
        .segmented { display: flex; border: 1px solid #cbd5e1; border-radius: 5px; overflow: hidden; background: #f1f5f9; }
        .radio-lbl { flex: 1; display: flex; align-items: center; justify-content: center; height: 36px; font-size: 14px; font-weight: 700; cursor: pointer; color: #475569; margin: 0; border: none; transition: background 0.1s, color 0.1s; }
        .radio-lbl input { display: none; }
        .radio-lbl.active { background: #0284c7; color: #ffffff; }
        .radio-lbl.disabled { opacity: 0.4; pointer-events: none; background: #e2e8f0; color: #94a3b8; }

        .btn-entry { width: 100%; height: 38px; border: none; border-radius: 5px; font-size: 15px; font-weight: 700; cursor: pointer; background: #0284c7; color: #ffffff; margin-top: 2px; }
        .btn-entry:active { background: #0369a1; }
        .btn-main { width: 100%; height: 38px; border: none; border-radius: 5px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 2px; color: #ffffff; }
        .btn-del { background: #e11d48; }
        .btn-del:active { background: #be123c; }
        .btn-green { background: #059669; color: #ffffff; border: none; border-radius: 5px; height: 30px; padding: 0 8px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; }
        
        .tab-row { display: flex; gap: 4px; margin-top: 6px; }
        .tab-btn { flex: 1; background: #f1f5f9; border: 1px solid #cbd5e1; font-weight: 700; font-size: 13px; padding: 6px 2px; text-align: center; border-radius: 5px; cursor: pointer; color: #475569; }
        .tab-btn.active { background: #0284c7; color: #ffffff; border-color: #0284c7; }
        
        .panel { border: 1px solid #cbd5e1; border-top: none; border-radius: 0 0 5px 5px; padding: 8px; display: none; background: #ffffff; }
        .panel.show { display: block; }
        
        .shift-blk { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #cbd5e1; font-size: 14px; }
        .shift-blk:first-child { margin-top: 0; padding-top: 0; border-top: none; }
        .txt-pre { font-family: monospace; background: #f8fafc; padding: 6px; border: 1px solid #e2e8f0; border-radius: 5px; font-size: 13px; white-space: pre-wrap; margin-top: 4px; color: #0f172a; line-height: 1.35; }
        
        .msg-box { padding: 8px; font-size: 13px; margin-bottom: 6px; border-radius: 5px; display: none; font-weight: 700; }
        .err-msg { background: #ffe4e6; color: #9f1239; border: 1px solid #fecdd3; }
        .suc-msg { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        
        .chk-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 13px; font-weight: 700; cursor: pointer; color: #334155; }
        .chk-row input { width: 16px; height: 16px; accent-color: #0284c7; }
    </style>
</head>
<body>

<div class="box">
    <!-- Meal Entry Card -->
    <div class="card">
        <h2>Meal Entry</h2>
        <div id="e-msg" class="msg-box"></div>
        <form id="f-meal">
            <div class="field-group">
                <label>Employee ID(s)</label>
                <input type="text" id="e-id" required>
            </div>
            
            <label class="chk-row">
                <input type="checkbox" id="e-multi"> Multiple Days Range
            </label>

            <div class="row">
                <div class="field-group"><label id="e-lbl-dt">Date</label><input type="date" id="e-start" required></div>
                <div class="field-group" id="e-end-wrap" style="display:none;"><label>End Date</label><input type="date" id="e-end"></div>
            </div>

            <div class="field-group">
                <label>Shift</label>
                <div class="segmented" id="g-shift">
                    <label class="radio-lbl active"><input type="radio" name="shift" value="Morning" checked>Morning</label>
                    <label class="radio-lbl"><input type="radio" name="shift" value="Afternoon">Afternoon</label>
                    <label class="radio-lbl"><input type="radio" name="shift" value="Night">Night</label>
                </div>
            </div>

            <div class="field-group">
                <label>Meal Type</label>
                <div class="segmented" id="g-meal">
                    <label class="radio-lbl active"><input type="radio" name="meal" value="Breakfast" checked>Breakfast</label>
                    <label class="radio-lbl"><input type="radio" name="meal" value="Lunch">Lunch</label>
                    <label class="radio-lbl"><input type="radio" name="meal" value="Dinner">Dinner</label>
                </div>
            </div>

            <div class="field-group">
                <label>Menu Option</label>
                <div class="segmented" id="g-menu">
                    <label class="radio-lbl active" id="l-reg"><input type="radio" name="menuOption" value="Regular" checked>Reg</label>
                    <label class="radio-lbl disabled" id="l-fried"><input type="radio" name="menuOption" value="Fried Egg" disabled>Fried</label>
                    <label class="radio-lbl disabled" id="l-poached"><input type="radio" name="menuOption" value="Poached Egg" disabled>Poached</label>
                    <label class="radio-lbl disabled" id="l-mutton"><input type="radio" name="menuOption" value="Mutton" disabled>Mutton</label>
                </div>
            </div>
            <button type="submit" class="btn-entry">Save Meal Entry</button>
        </form>
    </div>

    <!-- Summary Output Card -->
    <div class="card">
        <h2><span>Summary Output</span> <span id="s-lbl" style="font-size:12px; color:#0284c7; font-weight:700;"></span></h2>
        <div class="field-group">
            <label>Select Date</label>
            <input type="date" id="s-date" required>
        </div>
        <div class="tab-row" id="tab-row"></div>
        <div class="panel show" id="panel-Breakfast"></div>
        <div class="panel" id="panel-Lunch"></div>
        <div class="panel" id="panel-Dinner"></div>
    </div>

    <!-- Delete Record Card -->
    <div class="card">
        <h2>Delete Record</h2>
        <div id="d-msg" class="msg-box"></div>
        <form id="f-del">
            <div class="field-group">
                <label>ID(s)</label>
                <input type="text" id="d-id" required>
            </div>
            
            <label class="chk-row">
                <input type="checkbox" id="d-multi"> Multiple Days Range
            </label>

            <div class="row">
                <div class="field-group"><label id="d-lbl-dt">Date</label><input type="date" id="d-start" required></div>
                <div class="field-group" id="d-end-wrap" style="display:none;"><label>End Date</label><input type="date" id="d-end"></div>
            </div>

            <div class="field-group">
                <label>Meal</label>
                <select id="d-meal">
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                </select>
            </div>
            <button type="submit" class="btn-main btn-del">Delete Record</button>
        </form>
    </div>
</div>

<script>
    const cache = {};

    function getToday() {
        return new Date().toISOString().split('T')[0];
    }

    function fmtDMY(s) {
        if (!s || !s.includes('-')) return '';
        const p = s.split('-');
        return p[2] + '/' + p[1] + '/' + p[0];
    }

    function benNum(n) {
        return String(n).replace(/[0-9]/g, function(w) {
            return ('০১২৩৪৫৬৭৮৯')[w] || w;
        });
    }

    const today = getToday();
    document.getElementById('s-date').value = today;
    document.getElementById('e-start').value = today;
    document.getElementById('e-end').value = today;
    document.getElementById('d-start').value = today;
    document.getElementById('d-end').value = today;

    const savedId = localStorage.getItem('ccr_id') || '';
    document.getElementById('e-id').value = savedId;
    document.getElementById('d-id').value = savedId;

    document.getElementById('e-id').addEventListener('input', function(e) {
        const first = e.target.value.split(',')[0].trim();
        if (first) localStorage.setItem('ccr_id', first);
    });

    document.getElementById('d-id').addEventListener('input', function(e) {
        const first = e.target.value.split(',')[0].trim();
        if (first) localStorage.setItem('ccr_id', first);
    });

    document.getElementById('e-multi').addEventListener('change', function(e) {
        const m = e.target.checked;
        document.getElementById('e-end-wrap').style.display = m ? 'block' : 'none';
        document.getElementById('e-lbl-dt').innerText = m ? 'Start Date' : 'Date';
        if (!m) document.getElementById('e-end').value = document.getElementById('e-start').value;
    });

    document.getElementById('d-multi').addEventListener('change', function(e) {
        const m = e.target.checked;
        document.getElementById('d-end-wrap').style.display = m ? 'block' : 'none';
        document.getElementById('d-lbl-dt').innerText = m ? 'Start Date' : 'Date';
        if (!m) document.getElementById('d-end').value = document.getElementById('d-start').value;
    });

    document.getElementById('e-start').addEventListener('change', function(e) {
        if (!document.getElementById('e-multi').checked) document.getElementById('e-end').value = e.target.value;
        document.getElementById('s-date').value = e.target.value;
        loadSum();
    });

    document.getElementById('d-start').addEventListener('change', function(e) {
        if (!document.getElementById('d-multi').checked) document.getElementById('d-end').value = e.target.value;
    });

    let activeMeal = 'Breakfast';

    function showMsg(id, txt, type) {
        const el = document.getElementById(id);
        el.className = 'msg-box ' + (type === 'success' ? 'suc-msg' : 'err-msg');
        el.innerText = txt;
        el.style.display = 'block';
        setTimeout(function() { el.style.display = 'none'; }, 3000);
    }

    ['g-shift', 'g-meal', 'g-menu'].forEach(function(gid) {
        document.getElementById(gid).addEventListener('change', function(e) {
            if (e.target.disabled) return;
            const c = document.getElementById(gid);
            const lbls = c.querySelectorAll('.radio-lbl');
            for (let i = 0; i < lbls.length; i++) {
                lbls[i].classList.remove('active');
            }
            e.target.closest('.radio-lbl').classList.add('active');
        });
    });

    const mealInps = document.querySelectorAll('input[name="meal"]');
    for (let i = 0; i < mealInps.length; i++) {
        mealInps[i].addEventListener('change', function(e) {
            const isB = e.target.value === 'Breakfast';
            const arr = ['Fried Egg', 'Poached Egg', 'Mutton'];
            for (let j = 0; j < arr.length; j++) {
                const el = document.querySelector('input[value="' + arr[j] + '"]');
                if (el) {
                    el.disabled = isB;
                    el.closest('.radio-lbl').classList.toggle('disabled', isB);
                }
            }
            if (isB) {
                document.querySelector('input[value="Regular"]').checked = true;
                const menuLbls = document.querySelectorAll('#g-menu .radio-lbl');
                for (let k = 0; k < menuLbls.length; k++) {
                    menuLbls[k].classList.remove('active');
                }
                document.getElementById('l-reg').classList.add('active');
            }
        });
    }

    async function loadSum(pref) {
        if (pref) activeMeal = pref;
        const dt = document.getElementById('s-date').value;
        if (!dt) return;

        document.getElementById('s-lbl').innerText = (dt === today) ? '(Today)' : '';

        try {
            let recs = cache[dt];
            if (!recs) {
                const res = await fetch('/api/summary?dateStr=' + dt);
                const data = await res.json();
                recs = data.records || [];
                cache[dt] = recs;
            }

            const meals = ['Breakfast', 'Lunch', 'Dinner'];
            let tabHtml = '';
            for (let i = 0; i < meals.length; i++) {
                const m = meals[i];
                const cnt = recs.filter(function(r) { return r.meal === m; }).length;
                tabHtml += '<button type="button" class="tab-btn ' + (m === activeMeal ? 'active' : '') + '" onclick="switchT(\'' + m + '\')">' + m + ' (' + cnt + ')</button>';
            }
            document.getElementById('tab-row').innerHTML = tabHtml;

            for (let i = 0; i < meals.length; i++) {
                const m = meals[i];
                const panel = document.getElementById('panel-' + m);
                panel.classList.toggle('show', m === activeMeal);

                const mRecs = recs.filter(function(r) { return r.meal === m; });
                if (!mRecs.length) {
                    panel.innerHTML = '<div style="text-align:center; color:#64748b; padding:6px; font-weight:700;">No entries found</div>';
                    continue;
                }

                let body = '';
                const shifts = ['Morning', 'Afternoon', 'Night'];
                for (let s = 0; s < shifts.length; s++) {
                    const sh = shifts[s];
                    const sRecs = mRecs.filter(function(r) { return r.shift === sh; });
                    if (!sRecs.length) continue;
                    
                    const f = sRecs.filter(function(r) { return r.menuOption === 'Fried Egg'; }).length;
                    const p = sRecs.filter(function(r) { return r.menuOption === 'Poached Egg'; }).length;
                    const mu = sRecs.filter(function(r) { return r.menuOption === 'Mutton'; }).length;

                    let cStr = 'Total:' + sRecs.length;
                    if (f) cStr += ', F-' + f;
                    if (p) cStr += ', P-' + p;
                    if (mu) cStr += ', M-' + mu;

                    const ids = sRecs.map(function(r) {
                        const suf = r.menuOption === 'Poached Egg' ? '(P)' : (r.menuOption === 'Fried Egg' ? '(F)' : (r.menuOption === 'Mutton' ? '(M)' : ''));
                        return r.id + suf;
                    }).join(', ');
                    
                    body += '<div class="shift-blk"><div style="font-weight:700; color:#1e293b;">' + sh + ' Shift (' + cStr + ')</div><div style="margin-top:2px; color:#475569;">ID: ' + ids + '</div></div>';
                }

                const timeWord = m === 'Breakfast' ? 'সকালে' : (m === 'Lunch' ? 'দুপুরে' : 'রাতে');
                let wa = fmtDMY(dt) + '\n' + timeWord + ' মোট ' + benNum(mRecs.length) + ' জনের খাবার CCR এ আসবে。\nID: ';
                
                const reg = mRecs.filter(function(r) { return r.menuOption === 'Regular'; });
                if (reg.length) wa += reg.map(function(r) { return r.id; }).join(', ');
                
                const fr = mRecs.filter(function(r) { return r.menuOption === 'Fried Egg'; });
                if (fr.length) wa += '\nডিম ভাজি: ' + benNum(fr.length) + ' টা (' + fr.map(function(r) { return r.id; }).join(', ') + ')';
                
                const po = mRecs.filter(function(r) { return r.menuOption === 'Poached Egg'; });
                if (po.length) wa += '\nডিম পোচ: ' + benNum(po.length) + ' টা (' + po.map(function(r) { return r.id; }).join(', ') + ')';
                
                const mt = mRecs.filter(function(r) { return r.menuOption === 'Mutton'; });
                if (mt.length) wa += '\nখাসি (নন-মুসলিম): ' + benNum(mt.length) + ' টা (' + mt.map(function(r) { return r.id; }).join(', ') + ')';

                body += '<div class="txt-pre" id="wa-' + m + '">' + wa + '</div>' +
                        '<button type="button" class="btn-green" onclick="navigator.clipboard.writeText(document.getElementById(\'wa-' + m + '\').innerText)">📋 Copy WhatsApp</button>';

                panel.innerHTML = body;
            }
        } catch (e) { console.error(e); }
    }

    window.switchT = function(m) {
        activeMeal = m;
        const btns = document.querySelectorAll('.tab-btn');
        for (let i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('active', btns[i].textContent.indexOf(m) === 0);
        }
        const panels = document.querySelectorAll('.panel');
        for (let i = 0; i < panels.length; i++) {
            panels[i].classList.toggle('show', panels[i].id === 'panel-' + m);
        }
    };

    document.getElementById('f-meal').addEventListener('submit', async function(e) {
        e.preventDefault();
        const start = document.getElementById('e-start').value;
        const isMulti = document.getElementById('e-multi').checked;
        const end = isMulti ? document.getElementById('e-end').value : start;
        
        if (!start || !end) return showMsg('e-msg', 'Invalid dates', 'error');

        const mealType = document.querySelector('input[name="meal"]:checked').value;
        const shift = document.querySelector('input[name="shift"]:checked').value;
        const menuOpt = document.querySelector('input[name="menuOption"]:checked').value;
        const ids = document.getElementById('e-id').value.split(',').map(function(i) { return i.trim(); }).filter(Boolean);
        if (!ids.length) return;

        const now = new Date();
        const todayIso = now.toISOString().split('T')[0];
        const timeMin = now.getHours() * 60 + now.getMinutes();

        let curr = new Date(start), last = new Date(end);
        while (curr <= last) {
            const dtStr = curr.toISOString().split('T')[0];
            if (dtStr === todayIso) {
                if (mealType === 'Breakfast' && timeMin > 435) return showMsg('e-msg', 'Breakfast closed after 7:15 AM today!', 'error');
                if (mealType === 'Lunch' && timeMin > 660) return showMsg('e-msg', 'Lunch closed after 11:00 AM today!', 'error');
                if (mealType === 'Dinner' && timeMin > 1140) return showMsg('e-msg', 'Dinner closed after 7:00 PM today!', 'error');
            }
            curr.setDate(curr.getDate() + 1);
        }

        if (ids[0]) localStorage.setItem('ccr_id', ids[0]);

        let mod = 0, exist = 0, added = 0;
        curr = new Date(start);
        while (curr <= last) {
            const dtStr = curr.toISOString().split('T')[0];
            delete cach
