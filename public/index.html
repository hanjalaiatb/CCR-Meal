<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR Meal System</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 15px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1.05rem;
            outline: none;
            background-color: #fff;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
        }

        .radio-label input {
            width: 20px;
            height: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .btn-primary { background-color: var(--primary); }
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: #059669; margin-top: 15px; }

        .status-msg {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: none;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
        }

        .status-success { background-color: #dcfce7; color: #166534; }
        .status-error { background-color: #fee2e2; color: #991b1b; }

        /* ACCORDION & EXPANDABLE SUMMARY */
        .summary-accordion {
            margin-top: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }

        .accordion-btn {
            background: #e2e8f0;
            color: #0f172a;
            font-size: 1.15rem;
            font-weight: 800;
            padding: 14px 18px;
            text-align: left;
            border: none;
            border-bottom: 1px solid #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0;
        }

        .accordion-btn:hover {
            background: #cbd5e1;
        }

        .accordion-content {
            display: none;
            padding: 16px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        .accordion-content.active {
            display: block;
        }

        .shift-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1e40af;
            margin-bottom: 8px;
            margin-top: 12px;
        }

        .id-list {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0284c7;
            background: #f0f9ff;
            padding: 8px 12px;
            border-radius: 6px;
            word-break: break-all;
            margin: 8px 0 12px 0;
            border: 1px solid #bae6fd;
        }

        .count-line {
            font-size: 1rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .count-badge {
            display: inline-block;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .tag-fried { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .tag-poached { background-color: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
        .tag-mutton { background-color: #f3e8ff; color: #6b21a8; border: 1px solid #d8b4fe; }
        .tag-total { background-color: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; }

        .copy-section-wrapper {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 2px solid #e2e8f0;
        }

        .copy-section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-text-box {
            white-space: pre-wrap;
            background: #f8fafc;
            color: #0f172a;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: monospace;
            border: 1px solid #cbd5e1;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- SUBMIT MEAL CARD -->
    <div class="card">
        <h2>Meal Entry</h2>
        <div id="submit-status" class="status-msg"></div>

        <form id="mealForm">
            <div class="form-group">
                <label for="dateStr">Date:</label>
                <input type="date" id="dateStr" required>
            </div>

            <div class="form-group">
                <label for="employeeId">Employee ID:</label>
                <input type="text" id="employeeId" placeholder="e.g. 437" required>
            </div>

            <div class="form-group">
                <label for="shift">Shift:</label>
                <select id="shift" required>
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Night">Night</option>
                </select>
            </div>

            <div class="form-group">
                <label for="meal">Meal Type:</label>
                <select id="meal" required>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                </select>
            </div>

            <div class="form-group">
                <label>Preferred Menu Option:</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="menuOption" value="None" checked> Regular Menu (None)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="menuOption" value="Fried Egg"> Fried Egg (F)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="menuOption" value="Poached Egg"> Poached Egg (P)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="menuOption" value="Mutton"> Mutton (M)
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Submit Meal Entry</button>
        </form>
    </div>

    <!-- DELETE RECORD CARD -->
    <div class="card">
        <h2>Delete Record</h2>
        <div id="delete-status" class="status-msg"></div>

        <form id="deleteForm">
            <div class="form-group">
                <label for="deleteDateStr">Date:</label>
                <input type="date" id="deleteDateStr" required>
            </div>

            <div class="form-group">
                <label for="deleteId">Employee ID to Delete:</label>
                <input type="text" id="deleteId" placeholder="e.g. 437" required>
            </div>

            <div class="form-group">
                <label for="deleteMeal">Meal Type:</label>
                <select id="deleteMeal" required>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                </select>
            </div>

            <button type="submit" class="btn-danger" id="deleteBtn">Delete Record</button>
        </form>
    </div>

    <!-- SUMMARY CARD -->
    <div class="card">
        <h2>Summary Output</h2>
        <div class="form-group">
            <label for="summaryDate">Select Date for Summary:</label>
            <input type="date" id="summaryDate">
        </div>

        <div id="summaryContainer"></div>
    </div>

</div>

<script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateStr').value = today;
    document.getElementById('deleteDateStr').value = today;
    document.getElementById('summaryDate').value = today;

    function showStatus(elementId, message, isSuccess) {
        const el = document.getElementById(elementId);
        el.innerText = message;
        el.className = 'status-msg ' + (isSuccess ? 'status-success' : 'status-error');
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    // Auto-fetch summary when date changes
    document.getElementById('summaryDate').addEventListener('change', () => {
        loadSummary();
    });

    // Submit Handler
    document.getElementById('mealForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Saving...';

        const selectedMeal = document.getElementById('meal').value;
        const entryDate = document.getElementById('dateStr').value;

        const payload = {
            dateStr: entryDate,
            id: document.getElementById('employeeId').value.trim(),
            shift: document.getElementById('shift').value,
            meal: selectedMeal,
            menuOption: document.querySelector('input[name="menuOption"]:checked').value
        };

        try {
            const res = await fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                showStatus('submit-status', 'Entry saved successfully!', true);
                document.getElementById('employeeId').value = '';
                
                // Set summary date to match input date and auto-expand submitted meal summary
                document.getElementById('summaryDate').value = entryDate;
                loadSummary(selectedMeal);
            } else {
                showStatus('submit-status', 'Error: ' + (data.error || 'Failed to save'), false);
            }
        } catch (err) {
            showStatus('submit-status', 'Network connection error.', false);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Submit Meal Entry';
        }
    });

    // Delete Handler
    document.getElementById('deleteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const deleteBtn = document.getElementById('deleteBtn');
        deleteBtn.disabled = true;
        deleteBtn.innerText = 'Deleting...';

        const deleteMeal = document.getElementById('deleteMeal').value;
        const deleteDate = document.getElementById('deleteDateStr').value;

        const payload = {
            dateStr: deleteDate,
            id: document.getElementById('deleteId').value.trim(),
            meal: deleteMeal
        };

        try {
            const res = await fetch('/api/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                showStatus('delete-status', 'Record deleted successfully!', true);
                document.getElementById('deleteId').value = '';

                document.getElementById('summaryDate').value = deleteDate;
                loadSummary(deleteMeal);
            } else {
                showStatus('delete-status', data.message || 'Record not found.', false);
            }
        } catch (err) {
            showStatus('delete-status', 'Network connection error.', false);
        } finally {
            deleteBtn.disabled = false;
            deleteBtn.innerText = 'Delete Record';
        }
    });

    // Load and Render Accordion Summary
    async function loadSummary(expandMeal = null) {
        const date = document.getElementById('summaryDate').value;
        const container = document.getElementById('summaryContainer');
        container.innerHTML = '<p style="margin-top:15px; font-weight:bold; color:#64748b;">Updating summary...</p>';

        try {
            const res = await fetch(`/api/summary?date=${date}`);
            const data = await res.json();
            container.innerHTML = '';

            const allMeals = ['Breakfast', 'Lunch', 'Dinner'];

            allMeals.forEach(mealType => {
                const mealData = data[mealType];
                const isTargetToExpand = expandMeal === mealType;
                
                let contentInnerHtml = '';

                if (mealData) {
                    const rawText = mealData.text;
                    const parts = rawText.split("Copy section:");
                    const shiftSection = parts[0] || "";
                    const copySection = parts[1] ? "Copy section:" + parts[1] : "";

                    let shiftHtml = shiftSection
                        .replace(/(Breakfast Summary|Lunch Summary|Dinner Summary)/g, '')
                        .replace(/(Morning Shift|Afternoon Shift|Night Shift)/g, '<div class="shift-title">📍 $1</div>')
                        .replace(/(All Shift)/g, '<div class="shift-title" style="color:#0f172a; margin-top:15px;">🌐 $1</div>')
                        .replace(/ID : (.*)/g, '<div class="id-list">ID: <strong>$1</strong></div>')
                        .replace(/F-\s*(\d+)/g, '<span class="count-badge tag-fried">F- $1</span>')
                        .replace(/P-\s*(\d+)/g, '<span class="count-badge tag-poached">P- $1</span>')
                        .replace(/M-\s*(\d+)/g, '<span class="count-badge tag-mutton">M- $1</span>')
                        .replace(/Total-\s*(\d+)/g, '<span class="count-badge tag-total">Total: $1</span>')
                        .replace(/Count\s*:/g, '<div class="count-line">Count: ')
                        .replace(/\n\n/g, '</div>\n');

                    contentInnerHtml = `
                        <div>${shiftHtml}</div>
                        ${copySection ? `
                            <div class="copy-section-wrapper">
                                <div class="copy-section-title">Copy Section</div>
                                <div class="copy-text-box">${copySection.trim()}</div>
                            </div>
                        ` : ''}
                        <button type="button" class="btn-success" onclick="copyToClipboard(\`${rawText.replace(/`/g, '\\`')}\`, this)">Copy Format</button>
                    `;
                } else {
                    contentInnerHtml = `<p style="color:#64748b; font-weight:600;">No ${mealType} entries recorded for this date.</p>`;
                }

                const accordionItem = `
                    <div class="summary-accordion">
                        <button class="accordion-btn" onclick="toggleAccordion('${mealType}')">
                            <span>${mealType} Summary</span>
                            <span id="icon-${mealType}">${isTargetToExpand ? '▲' : '▼'}</span>
                        </button>
                        <div id="content-${mealType}" class="accordion-content ${isTargetToExpand ? 'active' : ''}">
                            ${contentInnerHtml}
                        </div>
                    </div>
                `;

                container.innerHTML += accordionItem;
            });

        } catch (err) {
            container.innerHTML = '<p style="margin-top:15px; color:#dc2626; font-weight:bold;">Error loading summary data.</p>';
        }
    }

    function toggleAccordion(mealType) {
        const content = document.getElementById(`content-${mealType}`);
        const icon = document.getElementById(`icon-${mealType}`);
        if (content.classList.contains('active')) {
            content.classList.remove('active');
            icon.innerText = '▼';
        } else {
            content.classList.add('active');
            icon.innerText = '▲';
        }
    }

    function copyToClipboard(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            const origText = btn.innerText;
            btn.innerText = 'Copied to Clipboard! ✓';
            setTimeout(() => { btn.innerText = origText; }, 2000);
        });
    }

    // Initial load on page view
    loadSummary();
</script>

</body>
</html>
