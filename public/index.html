<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR Meal System</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 8px; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; }
        .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; }
        .card-danger { background: #fff5f5; border-color: #fca5a5; }
        h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; }
        .sub { font-size: 0.7rem; color: #64748b; margin-bottom: 6px; }
        
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
        .row-3 { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 6px; margin-bottom: 6px; align-items: end; }
        .group { margin-bottom: 6px; }
        label { display: block; font-size: 0.65rem; font-weight: 600; color: #64748b; margin-bottom: 2px; text-transform: uppercase; }
        
        input, select { width: 100%; height: 30px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.8rem; background: #f8fafc; box-sizing: border-box; }
        input:focus, select:focus { border-color: #2563eb; background: #fff; outline: none; }
        
        .date-short { max-width: 130px; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
        
        .radio-lbl {
            display: flex; align-items: center; justify-content: center; height: 30px; padding: 0 2px;
            background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px;
            font-size: 0.7rem; font-weight: 600; cursor: pointer; color: #64748b; text-align: center; box-sizing: border-box;
        }
        .radio-lbl input { display: none; }
        .radio-lbl.active { background: #eff6ff; border-color: #2563eb; color: #2563eb; }
        .radio-lbl.disabled { opacity: 0.3; cursor: not-allowed; background: #f1f5f9; }

        button { width: 100%; height: 30px; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; margin-top: 3px; box-sizing: border-box; }
        .btn-blue { background: #2563eb; color: #fff; }
        .btn-red { background: #ef4444; color: #fff; }
        .btn-green { background: #059669; color: #fff; height: 26px; padding: 0 8px; font-size: 0.7rem; width: auto; margin-top: 4px; display: inline-block; border-radius: 4px; }

        .msg { padding: 5px; border-radius: 6px; margin-bottom: 6px; display: none; font-size: 0.75rem; }
        .msg-ok { background: #dcfce7; color: #15803d; }
        .msg-err { background: #fee2e2; color: #991b1b; }

        .acc { border: 1px solid #cbd5e1; border-radius: 6px; margin-top: 5px; overflow: hidden; background: #fff; }
        .acc-btn { width: 100%; padding: 7px 8px; background: #f8fafc; border: none; display: flex; justify-content: space-between; font-weight: 700; color: #2563eb; font-size: 0.8rem; cursor: pointer; text-align: left; align-items: center; }
        .acc-body { display: none; padding: 6px; border-top: 1px solid #cbd5e1; font-size: 0.75rem; }
        .acc-body.show { display: block; }

        .shift-blk { margin-top: 4px; padding-top: 3px; border-top: 1px dashed #cbd5e1; }
        .shift-title { font-weight: 700; font-size: 0.73rem; text-transform: uppercase; margin-bottom: 1px; }
        .txt-pre { font-family: monospace; background: #f8fafc; padding: 5px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.7rem; white-space: pre-wrap; line-height: 1.3; margin-top: 3px; }
    </style>
</head>
<body>

<div class="box">
    <!-- 1. MEAL ENTRY -->
    <div class="card">
        <h2>Meal Entry</h2>
        <div class="sub">Log daily meal counts</div>
        <div id="s-msg" class="msg"></div>
        <form id="f-meal">
            <div class="row-2">
                <div class="group" style="margin-bottom:0;">
                    <label>Employee ID</label>
                    <input type="text" id="e-id" required>
                </div>
                <div class="group" style="margin-bottom:0;">
                    <label>Date</label>
                    <input type="date" id="e-date" required>
                </div>
            </div>
            <div class="group" style="margin-top:6px;">
                <label>Shift</label>
                <div class="grid-3" id="g-shift">
                    <label class="radio-lbl active"><input type="radio" name="shift" value="Morning" checked>Morning</label>
                    <label class="radio-lbl"><input type="radio" name="shift" value="Afternoon">Afternoon</label>
                    <label class="radio-lbl"><input type="radio" name="shift" value="Night">Night</label>
                </div>
            </div>
            <div class="group">
                <label>Meal Type</label>
                <div class="grid-3" id="g-meal">
                    <label class="radio-lbl active"><input type="radio" name="meal" value="Breakfast" checked>Breakfast</label>
                    <label class="radio-lbl"><input type="radio" name="meal" value="Lunch">Lunch</label>
                    <label class="radio-lbl"><input type="radio" name="meal" value="Dinner">Dinner</label>
                </div>
            </div>
            <div class="group">
                <label>Menu Option</label>
                <div class="grid-4" id="g-menu">
                    <label class="radio-lbl active" id="lbl-reg"><input type="radio" name="menuOption" value="Regular" checked>Reg</label>
                    <label class="radio-lbl disabled" id="lbl-fried"><input type="radio" name="menuOption" value="Fried Egg" disabled>Fried</label>
                    <label class="radio-lbl disabled" id="lbl-poached"><input type="radio" name="menuOption" value="Poached Egg" disabled>Poached</label>
                    <label class="radio-lbl disabled" id="lbl-mutton"><input type="radio" name="menuOption" value="Mutton" disabled>Mutton</label>
                </div>
            </div>
            <button type="submit" class="btn-blue" id="btn-save">Save Entry</button>
        </form>
    </div>

    <!-- 2. SUMMARY -->
    <div class="card">
        <h2>Summary Output</h2>
        <div class="group date-short" style="margin-top:5px;">
            <label>Select Date</label>
            <input type="date" id="s-date">
        </div>
        <div id="summary-box"></div>
    </div>

    <!-- 3. DELETE RECORD -->
    <div class="card">
        <h2>Delete Specific Record</h2>
        <div class="sub">Remove entry by Date, Meal, and ID</div>
        <div id="d-msg" class="msg"></div>
        <form id="f-del">
            <div class="row-3">
                <div class="group" style="margin-bottom:0;">
                    <label>Select ID</label>
                    <select id="d-id-select" required>
                        <option value="">None</option>
                    </select>
                </div>
                <div class="group" style="margin-bottom:0;">
                    <label>Date</label>
                    <input type="date" id="d-date" required>
                </div>
                <div class="group" style="margin-bottom:0;">
                    <label>Meal Type</label>
                    <select id="d-meal" required>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-red" style="margin-top:6px;">Delete Record</button>
        </form>
    </div>

    <!-- 4. DELETE ALL DATA -->
    <div class="card card-danger">
        <h2 style="color: #991b1b;">Danger Zone</h2>
        <div class="sub">Permanently clear all database records</div>
        <div id="da-msg" class="msg"></div>
        <button type="button" class="btn-red" id="btn-delete-all">Delete All Data</button>
    </div>
</div>

<script>
    (function() {
        const d = new Date();
        const localDateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

        const maxDateObj = new Date();
        maxDateObj.setDate(maxDateObj.getDate() + 4);
        const maxDateStr = maxDateObj.getFullYear() + '-' + String(maxDateObj.getMonth() + 1).padStart(2, '0') + '-' + String(maxDateObj.getDate()).padStart(2, '0');

        ['e-date', 's-date', 'd-date'].forEach(function(id) {
            const el = document.getElementById(id);
            if (el) {
                el.value = localDateStr;
                if (id === 'e-date') {
                    el.min = localDateStr;
                    el.max = maxDateStr;
                }
            }
        });
    })();

    function bindRadios(groupId) {
        const c = document.getElementById(groupId);
        if(!c) return;
        c.querySelectorAll('input').forEach(function(inp) {
            inp.addEventListener('change', function(e) {
                if (e.target.disabled) return;
                c.querySelectorAll('.radio-lbl').forEach(function(l) { l.classList.remove('active'); });
                e.target.closest('.radio-lbl').classList.add('active');
            });
        });
    }

    window.addEventListener('DOMContentLoaded', function() {
        const d = new Date();
        const localDateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        
        ['e-date', 's-date', 'd-date'].forEach(function(id) {
            const el = document.getElementById(id);
            if (el && !el.value) el.value = localDateStr;
        });

        bindRadios('g-shift');
        bindRadios('g-meal');
        bindRadios('g-menu');

        document.querySelectorAll('input[name="meal"]').forEach(function(inp) {
            inp.addEventListener('change', function(e) {
                const isBreakfast = e.target.value === 'Breakfast';
                const friedInp = document.querySelector('input[value="Fried Egg"]');
                const poachedInp = document.querySelector('input[value="Poached Egg"]');
                const muttonInp = document.querySelector('input[value="Mutton"]');
                const regInp = document.querySelector('input[value="Regular"]');

                [friedInp, poachedInp, muttonInp].forEach(function(el) {
                    if (!el) return;
                    el.disabled = isBreakfast;
                    const lbl = el.closest('.radio-lbl');
                    if (isBreakfast) {
                        lbl.classList.add('disabled');
                        lbl.classList.remove('active');
                    } else {
                        lbl.classList.remove('disabled');
                    }
                });

                if (isBreakfast && regInp) {
                    regInp.checked = true;
                    document.querySelectorAll('#g-menu .radio-lbl').forEach(function(l) { l.classList.remove('active'); });
                    const lblReg = document.getElementById('lbl-reg');
                    if (lblReg) lblReg.classList.add('active');
                }
            });
        });

        loadSummaryData('Breakfast');
        updateDelDropdown();

        const eDateInput = document.getElementById('e-date');
        if (eDateInput) {
            eDateInput.addEventListener('input', function(e) {
                document.getElementById('s-date').value = e.target.value;
                document.getElementById('d-date').value = e.target.value;
                loadSummaryData();
                updateDelDropdown();
            });
        }
        
        const sDateInput = document.getElementById('s-date');
        if (sDateInput) sDateInput.addEventListener('input', function() { loadSummaryData(); });
        
        const dDateInput = document.getElementById('d-date');
        if (dDateInput) dDateInput.addEventListener('input', function() { updateDelDropdown(); });
        
        const dMealInput = document.getElementById('d-meal');
        if (dMealInput) dMealInput.addEventListener('change', function() { updateDelDropdown(); });

        document.getElementById('btn-delete-all').addEventListener('click', async function() {
            if (!confirm('Are you sure you want to delete ALL data?')) return;
            const res = await fetch('/api/delete-all', { method: 'POST' });
            const data = await res.json();
            if (res.ok && data.success) {
                showMsg('da-msg', 'All data deleted successfully!', true);
                loadSummaryData();
                updateDelDropdown();
            } else {
                showMsg('da-msg', 'Failed to delete all data', false);
            }
        });
    });

    function showMsg(id, text, ok) {
        const el = document.getElementById(id);
        if(!el) return;
        el.innerText = text;
        el.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
        el.style.display = 'block';
        setTimeout(function() { el.style.display = 'none'; }, 3000);
    }

    document.getElementById('f-meal').addEventListener('submit', async function(e) {
        e.preventDefault();
        const payload = {
            dateStr: document.getElementById('e-date').value,
            id: document.getElementById('e-id').value.trim(),
            shift: document.querySelector('input[name="shift"]:checked').value,
            meal: document.querySelector('input[name="meal"]:checked').value,
            menuOption: document.querySelector('input[name="menuOption"]:checked').value
        };

        const res = await fetch('/api/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.success) {
            let msgText = '';
            if (data.status === 'added') {
                msgText = 'Added successfully!';
            } else if (data.status === 'modified') {
                msgText = 'Modified successfully!';
            } else {
                msgText = 'Already recorded!';
            }

            showMsg('s-msg', msgText, true);
            document.getElementById('e-id').value = '';
            loadSummaryData(payload.meal);
            updateDelDropdown();
        } else {
            showMsg('s-msg', data.error || 'Error', false);
        }
    });

    document.getElementById('f-del').addEventListener('submit', async function(e) {
        e.preventDefault();
        const id = document.getElementById('d-id-select').value;
        const dateStr = document.getElementById('d-date').value;
        const meal = document.getElementById('d-meal').value;

        if (!id) return;
        const res = await fetch('/api/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id, dateStr: dateStr, meal: meal })
        });
        const data = await res.json();
        if (res.ok && data.success) {
            showMsg('d-msg', 'Deleted ID ' + id, true);
            loadSummaryData();
            updateDelDropdown();
        } else {
            showMsg('d-msg', 'Delete failed', false);
        }
    });

    async function loadSummaryData(openMeal) {
        if (openMeal === undefined) openMeal = null;
        const dateStr = document.getElementById('s-date').value;
        if (!dateStr) return;
        const res = await fetch('/api/summary?dateStr=' + dateStr);
        const data = await res.json();
        renderSummary(dateStr, data.records || [], openMeal);
    }

    async function updateDelDropdown() {
        const dDate = document.getElementById('d-date').value;
        const dMeal = document.getElementById('d-meal').value;
        const sel = document.getElementById('d-id-select');
        if (!sel || !dDate) return;
        
        const res = await fetch('/api/summary?dateStr=' + dDate);
        const data = await res.json();
        const dayRecords = data.records || [];

        sel.innerHTML = '<option value="">None</option>';
        dayRecords.filter(function(r) { return r.meal === dMeal; }).forEach(function(r) {
            const opt = document.createElement('option');
            opt.value = r.id;
            opt.textContent = r.id;
            sel.appendChild(opt);
        });
    }

    function renderSummary(dateStr, records, openMeal) {
        const box = document.getElementById('summary-box');
        if (!box) return;
        let html = '';

        ['Breakfast', 'Lunch', 'Dinner'].forEach(function(meal) {
            const mRecs = records.filter(function(r) { return r.meal === meal; });
            const isOpen = (meal === openMeal);

            html += '<div class="acc">' +
                    '<button type="button" class="acc-btn" onclick="toggleAcc(\'' + meal + '\')">' +
                    '<span>' + meal + '</span><span id="arrow-' + meal + '">Total: ' + mRecs.length + ' ' + (isOpen ? '▲' : '▼') + '</span>' +
                    '</button>' +
                    '<div class="acc-body ' + (isOpen ? 'show' : '') + '" id="acc-' + meal + '">';

            if (mRecs.length === 0) {
                html += '<div>No entries found.</div>';
            } else {
                ['Morning', 'Afternoon', 'Night'].forEach(function(shift) {
                    const sRecs = mRecs.filter(function(r) { return r.shift === shift; });
                    if (sRecs.length > 0) {
                        const idsShort = sRecs.map(function(r) {
                            if (r.menuOption === 'Poached Egg') return r.id + '(P)';
                            if (r.menuOption === 'Fried Egg') return r.id + '(F)';
                            if (r.menuOption === 'Mutton') return r.id + '(M)';
                            return r.id;
                        }).join(', ');

                        const counts = {};
                        sRecs.forEach(function(r) {
                            if (r.menuOption === 'Poached Egg') counts['P'] = (counts['P'] || 0) + 1;
                            else if (r.menuOption === 'Fried Egg') counts['F'] = (counts['F'] || 0) + 1;
                            else if (r.menuOption === 'Mutton') counts['M'] = (counts['M'] || 0) + 1;
                        });
                        
                        let countParts = Object.keys(counts).map(function(k) { return k + '-' + counts[k]; });
                        countParts.push('Total-' + sRecs.length);
                        const countStr = countParts.join(', ');

                        html += '<div class="shift-blk">' +
                                '<div class="shift-title">' + shift + ' shift</div>' +
                                '<div>Meal ID: ' + idsShort + '</div>' +
                                '<div>Meal count: ' + countStr + '</div>' +
                                '</div>';
                    }
                });

                let waIds = mRecs.map(function(r) { return r.id; }).join(', ');
                let wa = meal + ' Meal from CCR on ' + dateStr + '\nID: ' + waIds + '\nTotal Meal Count: ' + mRecs.length;
                
                ['Poached Egg', 'Fried Egg', 'Mutton'].forEach(function(opt) {
                    const sub = mRecs.filter(function(r) { return r.menuOption === opt; });
                    if (sub.length > 0) wa += '\n' + opt + ': ' + sub.length + ' (' + sub.map(function(r) { return r.id; }).join(', ') + ')';
                });

                html += '<div style="margin-top:6px; border-top:1px solid #cbd5e1; padding-top:
