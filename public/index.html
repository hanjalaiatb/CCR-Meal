<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCR</title>
<style>
body{font-family:sans-serif;margin:0;padding:2px;font-size:15px;background:#fff;color:#000}
div{box-sizing:border-box}
.card{border:1px solid #999;padding:4px;margin-bottom:4px}
h2{font-size:15px;margin:0 0 4px;border-bottom:1px solid #999;padding-bottom:2px;display:flex;justify-content:space-between}
label{display:block;font-size:13px;font-weight:bold;margin:2px 0}
input,select{width:100%;height:35px;padding:0 4px;border:1px solid #999;font-size:15px;background:#fff}
.row{display:flex;gap:4px}
.row>div{flex:1}
.seg{display:flex;border:1px solid #999}
.rl{flex:1;text-align:center;line-height:35px;font-size:14px;font-weight:bold;cursor:pointer;background:#eee;color:#333}
.rl input{display:none}
.rl.active{background:#0066cc;color:#fff}
.rl.dis{opacity:0.3;pointer-events:none}
.btn{width:100%;height:35px;border:none;font-size:15px;font-weight:bold;cursor:pointer;background:#0066cc;color:#fff;margin-top:4px}
.btn-del{background:#cc0000}
.btn-g{background:#009933;color:#fff;border:none;height:30px;padding:0 6px;font-size:13px;font-weight:bold;cursor:pointer;margin-top:2px}
.tabs{display:flex;gap:2px;margin-top:4px}
.tbtn{flex:1;background:#eee;border:1px solid #999;font-weight:bold;font-size:13px;height:35px;text-align:center;cursor:pointer}
.tbtn.active{background:#0066cc;color:#fff}
.panel{border:1px solid #999;border-top:none;padding:4px;display:none}
.panel.show{display:block}
.sblk{margin-top:4px;padding-top:4px;border-top:1px dashed #999;font-size:14px}
.tpre{font-family:monospace;background:#f9f9f9;padding:4px;border:1px solid #ccc;font-size:13px;white-space:pre-wrap;margin-top:2px}
.msg{padding:4px;font-size:13px;margin-bottom:2px;font-weight:bold;display:none}
.err{background:#ffcccc;color:#990000}
.suc{background:#ccffcc;color:#006600}
.chk{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:bold;height:25px}
.chk input{width:15px;height:15px}
</style>
</head>
<body>

<div class="card">
<h2>Meal Entry</h2>
<div id="e-msg" class="msg"></div>
<form id="f-meal">
<label>Employee ID(s)</label>
<input type="text" id="e-id" required>
<label class="chk"><input type="checkbox" id="e-multi"> Multiple Days Range</label>
<div class="row">
<div><label id="e-ldt">Date</label><input type="date" id="e-start" required></div>
<div id="e-ew" style="display:none"><label>End Date</label><input type="date" id="e-end"></div>
</div>
<label>Shift</label>
<div class="seg" id="g-shift">
<label class="rl active"><input type="radio" name="shift" value="Morning" checked>Morning</label>
<label class="rl"><input type="radio" name="shift" value="Afternoon">Afternoon</label>
<label class="rl"><input type="radio" name="shift" value="Night">Night</label>
</div>
<label>Meal Type</label>
<div class="seg" id="g-meal">
<label class="rl active"><input type="radio" name="meal" value="Breakfast" checked>Breakfast</label>
<label class="rl"><input type="radio" name="meal" value="Lunch">Lunch</label>
<label class="rl"><input type="radio" name="meal" value="Dinner">Dinner</label>
</div>
<label>Menu Option</label>
<div class="seg" id="g-menu">
<label class="rl active" id="l-reg"><input type="radio" name="menuOption" value="Regular" checked>Reg</label>
<label class="rl dis" id="l-fri"><input type="radio" name="menuOption" value="Fried Egg" disabled>Fried</label>
<label class="rl dis" id="l-poa"><input type="radio" name="menuOption" value="Poached Egg" disabled>Poached</label>
<label class="rl dis" id="l-mut"><input type="radio" name="menuOption" value="Mutton" disabled>Mutton</label>
</div>
<button type="submit" class="btn">Save Meal Entry</button>
</form>
</div>

<div class="card">
<h2><span>Summary Output</span> <span id="s-lbl" style="font-size:13px;color:#0066cc"></span></h2>
<label>Select Date</label>
<input type="date" id="s-date" required>
<div class="tabs" id="tab-row"></div>
<div class="panel show" id="p-Breakfast"></div>
<div class="panel" id="p-Lunch"></div>
<div class="panel" id="p-Dinner"></div>
</div>

<div class="card">
<h2>Delete Record</h2>
<div id="d-msg" class="msg"></div>
<form id="f-del">
<label>ID(s)</label>
<input type="text" id="d-id" required>
<label class="chk"><input type="checkbox" id="d-multi"> Multiple Days Range</label>
<div class="row">
<div><label id="d-ldt">Date</label><input type="date" id="d-start" required></div>
<div id="d-ew" style="display:none"><label>End Date</label><input type="date" id="d-end"></div>
</div>
<label>Meal</label>
<select id="d-meal"><option value="Breakfast">Breakfast</option><option value="Lunch">Lunch</option><option value="Dinner">Dinner</option></select>
<button type="submit" class="btn btn-del">Delete Record</button>
</form>
</div>

<script>
const cache = {};
const getBDT = () => {
    const d = new Date();
    const b = new Date(d.getTime() + (d.getTimezoneOffset() * 60000) + 21600000);
    return `${b.getFullYear()}-${String(b.getMonth()+1).padStart(2,'0')}-${String(b.getDate()).padStart(2,'0')}`;
};
const today = getBDT();
const fmt = s => s ? s.split('-').reverse().join('/') : '';
const bn = n => String(n).replace(/\d/g, d => ['০','১','২','৩','৪','৫','৬','৭','৮','৯'][d]);

['s-date', 'e-start', 'e-end', 'd-start', 'd-end'].forEach(id => document.getElementById(id).value = today);
const sid = localStorage.getItem('ccr_id') || '';
['e-id', 'd-id'].forEach(id => document.getElementById(id).value = sid);

['e-id', 'd-id'].forEach(id => document.getElementById(id).addEventListener('input', e => {
    const f = e.target.value.split(',')[0].trim();
    if(f) localStorage.setItem('ccr_id', f);
}));

[['e-multi','e-ew','e-ldt','e-start','e-end'], ['d-multi','d-ew','d-ldt','d-start','d-end']].forEach(x => {
    document.getElementById(x[0]).addEventListener('change', e => {
        const m = e.target.checked;
        document.getElementById(x[1]).style.display = m ? 'block' : 'none';
        document.getElementById(x[2]).innerText = m ? 'Start Date' : 'Date';
        if(!m) document.getElementById(x[4]).value = document.getElementById(x[3]).value;
    });
});

document.getElementById('e-start').addEventListener('change', e => {
    if(!document.getElementById('e-multi').checked) document.getElementById('e-end').value = e.target.value;
    document.getElementById('s-date').value = e.target.value;
    loadSum();
});
document.getElementById('d-start').addEventListener('change', e => {
    if(!document.getElementById('d-multi').checked) document.getElementById('d-end').value = e.target.value;
});

let actM = 'Breakfast';
function msg(id, txt, t) {
    const el = document.getElementById(id);
    el.className = 'msg ' + (t === 's' ? 'suc' : 'err');
    el.innerText = txt;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
}

['g-shift', 'g-meal', 'g-menu'].forEach(gid => {
    document.getElementById(gid).addEventListener('change', e => {
        if(e.target.disabled) return;
        document.querySelectorAll('#'+gid+' .rl').forEach(l => l.classList.remove('active'));
        e.target.closest('.rl').classList.add('active');
    });
});

document.querySelectorAll('input[name="meal"]').forEach(inp => {
    inp.addEventListener('change', e => {
        const isB = e.target.value === 'Breakfast';
        ['Fried Egg', 'Poached Egg', 'Mutton'].forEach(v => {
            const el = document.querySelector(`input[value="${v}"]`);
            if(el) { el.disabled = isB; el.closest('.rl').classList.toggle('dis', isB); }
        });
        if(isB) {
            document.querySelector('input[value="Regular"]').checked = true;
            document.querySelectorAll('#g-menu .rl').forEach(l => l.classList.remove('active'));
            document.getElementById('l-reg').classList.add('active');
        }
    });
});

async function loadSum(pref) {
    if(pref) actM = pref;
    const dt = document.getElementById('s-date').value;
    if(!dt) return;
    document.getElementById('s-lbl').innerText = (dt === today) ? '(Today)' : '';

    try {
        let recs = cache[dt];
        if(!recs) {
            const res = await fetch('/api/summary?dateStr=' + dt);
            const data = await res.json();
            recs = data.records || [];
            cache[dt] = recs;
        }

        const meals = ['Breakfast', 'Lunch', 'Dinner'];
        let tHtml = '';
        meals.forEach(m => {
            const cnt = recs.filter(r => r.meal === m).length;
            tHtml += `<button type="button" class="tbtn ${m === actM ? 'active' : ''}" onclick="swT('${m}')">${m} (${cnt})</button>`;
        });
        document.getElementById('tab-row').innerHTML = tHtml;

        meals.forEach(m => {
            const panel = document.getElementById('p-' + m);
            panel.classList.toggle('show', m === actM);
            const mRecs = recs.filter(r => r.meal === m);

            if(!mRecs.length) {
                panel.innerHTML = '<div style="text-align:center;padding:4px;font-weight:bold;font-size:14px">No entries found</div>';
                return;
            }

            let body = '';
            ['Morning', 'Afternoon', 'Night'].forEach(sh => {
                const sRecs = mRecs.filter(r => r.shift === sh);
                if(!sRecs.length) return;
                const f = sRecs.filter(r => r.menuOption === 'Fried Egg').length;
                const p = sRecs.filter(r => r.menuOption === 'Poached Egg').length;
                const mu = sRecs.filter(r => r.menuOption === 'Mutton').length;
                let cStr = 'Total:' + sRecs.length;
                if(f) cStr += ', F-' + f;
                if(p) cStr += ', P-' + p;
                if(mu) cStr += ', M-' + mu;
                const ids = sRecs.map(r => r.id + (r.menuOption === 'Poached Egg' ? '(P)' : r.menuOption === 'Fried Egg' ? '(F)' : r.menuOption === 'Mutton' ? '(M)' : '')).join(', ');
                body += `<div class="sblk"><div style="font-weight:bold;font-size:14px">${sh} Shift (${cStr})</div><div style="font-size:14px">ID: ${ids}</div></div>`;
            });

            const tw = m === 'Breakfast' ? 'সকালে' : (m === 'Lunch' ? 'দুপুরে' : 'রাতে');
            let wa = `${fmt(dt)}\n${tw} মোট ${bn(mRecs.length)} জনের খাবার CCR এ আসবে。\nID: `;
            const reg = mRecs.filter(r => r.menuOption === 'Regular');
            if(reg.length) wa += reg.map(r => r.id).join(', ');
            const fr = mRecs.filter(r => r.menuOption === 'Fried Egg');
            if(fr.length) wa += `\nডিম ভাজি: ${bn(fr.length)} টা (` + fr.map(r => r.id).join(', ') + ')';
            const po = mRecs.filter(r => r.menuOption === 'Poached Egg');
            if(po.length) wa += `\nডিম পোচ: ${bn(po.length)} টা (` + po.map(r => r.id).join(', ') + ')';
            const mt = mRecs.filter(r => r.menuOption === 'Mutton');
            if(mt.length) wa += `\nখাসি (নন-মুসলিম): ${bn(mt.length)} টা (` + mt.map(r => r.id).join(', ') + ')';

            body += `<div class="tpre" id="wa-${m}">${wa}</div>` +
                    `<button type="button" class="btn-g" onclick="navigator.clipboard.writeText(document.getElementById('wa-${m}').innerText)">📋 Copy WhatsApp</button>`;
            panel.innerHTML = body;
        });
    } catch(e) { console.error(e); }
}

window.swT = function(m) {
    actM = m;
    document.querySelectorAll('.tbtn').forEach(b => b.classList.toggle('active', b.textContent.startsWith(m)));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('show', p.id === 'p-' + m));
};

document.getElementById('f-meal').addEventListener('submit', async e => {
    e.preventDefault();
    const start = document.getElementById('e-start').value;
    const end = document.getElementById('e-multi').checked ? document.getElementById('e-end').value : start;
    if(!start || !end) return msg('e-msg', 'Error: Invalid date range.', 'e');

    const mealType = document.querySelector('input[name="meal"]:checked').value;
    const shift = document.querySelector('input[name="shift"]:checked').value;
    const menuOpt = document.querySelector('input[name="menuOption"]:checked').value;
    const ids = document.getElementById('e-id').value.split(',').map(i => i.trim()).filter(Boolean);
    if(!ids.length) return msg('e-msg', 'Error: Enter at least one Employee ID.', 'e');

    const dNow = new Date();
    const bdtNow = new Date(dNow.getTime() + (dNow.getTimezoneOffset() * 60000) + 21600000);
    const todayIso = `${bdtNow.getFullYear()}-${String(bdtNow.getMonth()+1).padStart(2,'0')}-${String(bdtNow.getDate()).padStart(2,'0')}`;
    const timeMin = bdtNow.getHours() * 60 + bdtNow.getMinutes();

    let curr = new Date(start), last = new Date(end);
    while(curr <= last) {
        const dtStr = curr.toISOString().split('T')[0];
        const diffH = (bdtNow - new Date(dtStr)) / 3600000;
        if(diffH > 48) return msg('e-msg', `Rejected: Cannot modify/enter records for ${dtStr} as 48 hours have passed!`, 'e');
        if(dtStr === todayIso) {
            if(mealType === 'Breakfast' && timeMin > 435) return msg('e-msg', 'Cutoff: Breakfast entry closed after 7:15 AM today!', 'e');
            if(mealType === 'Lunch' && timeMin > 660) return msg('e-msg', 'Cutoff: Lunch entry closed after 11:00 AM today!', 'e');
            if(mealType === 'Dinner' && timeMin > 1140) return msg('e-msg', 'Cutoff: Dinner entry closed after 7:00 PM today!', 'e');
        }
        curr.setDate(curr.getDate() + 1);
    }

    if(ids[0]) localStorage.setItem('ccr_id', ids[0]);
    let mod = 0, exist = 0, added = 0;
    curr = new Date(start);
    while(curr <= last) {
        const dtStr = curr.toISOString().split('T')[0];
        delete cache[dtStr];
        const res = await fetch('/api/summary?dateStr=' + dtStr);
        const data = await res.json();
        const dayRecs = data.records || [];

        for(let i = 0; i < ids.length; i++) {
            const id = ids[i];
            const ex = dayRecs.find(r => r.id === id && r.meal === mealType);
            if(ex) {
                if(ex.shift === shift && ex.menuOption === menuOpt) exist++;
                else mod++;
            } else added++;

            await fetch('/api/submit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ dateStr: dtStr, id, shift, meal: mealType, menuOption: menuOpt })
            });
        }
        curr.setDate(curr.getDate() + 1);
    }

    document.getElementById('s-date').value = start;
    let parts = [];
    if(added) parts.push(added + ' added');
    if(mod) parts.push(mod + ' modified');
    if(exist) parts.push(exist + ' already existed');
    msg('e-msg', 'Success: ' + parts.join(' | ') + '.', (mod || added) ? 's' : 'e');
    loadSum(mealType);
});

document.getElementById('f-del').addEventListener('submit', async e => {
    e.preventDefault();
    const start = document.getElementById('d-start').value;
    const end = document.getElementById('d-multi').checked ? document.getElementById('d-end').value : start;
    if(!start || !end) return msg('d-msg', 'Error: Invalid date range.', 'e');

    const ids = document.getElementById('d-id').value.split(',').map(i => i.trim()).filter(Boolean);
    const mealVal = document.getElementById('d-meal').value;
    if(!ids.length) return msg('d-msg', 'Error: Enter at least one ID.', 'e');

    const dNow = new Date();
    const bdtNow = new Date(dNow.getTime() + (dNow.getTimezoneOffset() * 60000) + 21600000);

    let curr = new Date(start), last = new Date(end);
    while(curr <= last) {
        const dtStr = curr.toISOString().split('T')[0];
        if((bdtNow - new Date(dtStr)) / 3600000 > 48) return msg('d-msg', `Rejected: Cannot delete records for ${dtStr} past 48 hours!`, 'e');
        curr.setDate(curr.getDate() + 1);
    }

    if(ids[0]) localStorage.setItem('ccr_id', ids[0]);
    curr = new Date(start);
    while(curr <= last) {
        const dtStr = curr.toISOString().split('T')[0];
        delete cache[dtStr];
        for(let i = 0; i < ids.length; i++) {
            await fetch('/api/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: ids[i], dateStr: dtStr, meal: mealVal })
            });
        }
        curr.setDate(curr.getDate() + 1);
    }
    document.getElementById('s-date').value = start;
    msg('d-msg', 'Success: Record(s) deleted successfully!', 's');
    loadSum(mealVal);
});

document.getElementById('s-date').addEventListener('change', () => loadSum());
loadSum();
</script>
</body>
</html>
