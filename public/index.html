<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR Meal System</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 6px; display: flex; justify-content: center; font-size: 1rem; }
        .box { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 8px; }
        .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; }
        h2 { font-size: 1.1rem; font-weight: 700; margin: 0 0 6px 0; color: #1e293b; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .card-body { display: none; }
        .card.expanded .card-body { display: block; }
        .toggle-icon { font-size: 0.9rem; font-weight: normal; color: #64748b; }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 2px; text-transform: uppercase; }
        input, select { width: 100%; height: 38px; padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1rem; background: #f8fafc; box-sizing: border-box; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .radio-lbl { display: flex; align-items: center; justify-content: center; height: 38px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.9rem; font-weight: 600; cursor: pointer; color: #475569; }
        .radio-lbl input { display: none; }
        .radio-lbl.active { background: #eff6ff; border-color: #2563eb; color: #2563eb; }
        .radio-lbl.disabled { opacity: 0.3; background: #f1f5f9; pointer-events: none; }
        button { width: 100%; height: 40px; border: none; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 4px; }
        .btn-blue { background: #2563eb; color: #fff; }
        .btn-red { background: #ef4444; color: #fff; }
        .btn-green { background: #059669; color: #fff; height: 40px; padding: 0 12px; font-size: 1rem; width: auto; margin-top: 8px; display: inline-block; }
        
        .tab-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; }
        .tab-btn { background: #f1f5f9; border: 1px solid #cbd5e1; color: #1e40af; font-weight: 700; font-size: 0.95rem; padding: 10px 2px; text-align: center; border-radius: 4px; cursor: pointer; }
        .tab-btn.active { background: #dbeafe; border-color: #2563eb; }
        
        .panel { border: 1px solid #cbd5e1; border-top: none; border-radius: 0 0 6px 6px; background: #fff; padding: 10px; font-size: 1rem; display: none; }
        .panel.show { display: block; }

        .shift-blk { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #cbd5e1; }
        .txt-pre { font-family: monospace; background: #f8fafc; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.9rem; white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; margin-top: 8px; line-height: 1.5; }
        .field-group { margin-bottom: 6px; }
        .msg-box { padding: 8px; border-radius: 4px; font-size: 0.95rem; margin-bottom: 6px; display: none; }
        .err-msg { background: #fee2e2; color: #991b1b; }
        .suc-msg { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>

<div class="box">
    <!-- Meal Entry Card (Collapsed by default if ID exists) -->
    <div class="card" id="card-entry">
        <h2 onclick="toggleCard('card-entry')"><span>Meal Entry</span><span class="toggle-icon" id="icon-entry">▼</span></h2>
        <div class="card-body">
            <div id="e-msg" class="msg-box"></div>
            <form id="f-meal">
                <div class="field-group"><label>Employee ID(s)</label><input type="text" id="e-id" required></div>
                <div class="row">
                    <div><label>Start Date</label><input type="text" id="e-start-date" required></div>
                    <div><label>End Date</label><input type="text" id="e-end-date" required></div>
                </div>
                <div class="field-group"><label>Shift</label>
                    <div class="grid-3" id="g-shift">
                        <label class="radio-lbl active"><input type="radio" name="shift" value="Morning" checked>Morning</label>
                        <label class="radio-lbl"><input type="radio" name="shift" value="Afternoon">Afternoon</label>
                        <label class="radio-lbl"><input type="radio" name="shift" value="Night">Night</label>
                    </div>
                </div>
                <div class="field-group"><label>Meal Type</label>
                    <div class="grid-3" id="g-meal">
                        <label class="radio-lbl active"><input type="radio" name="meal" value="Breakfast" checked>Breakfast</label>
                        <label class="radio-lbl"><input type="radio" name="meal" value="Lunch">Lunch</label>
                        <label class="radio-lbl"><input type="radio" name="meal" value="Dinner">Dinner</label>
                    </div>
                </div>
                <div class="field-group"><label>Menu Option</label>
                    <div class="grid-4" id="g-menu">
                        <label class="radio-lbl active" id="lbl-reg"><input type="radio" name="menuOption" value="Regular" checked>Reg</label>
                        <label class="radio-lbl disabled" id="lbl-fried"><input type="radio" name="menuOption" value="Fried Egg" disabled>Fried</label>
                        <label class="radio-lbl disabled" id="lbl-poached"><input type="radio" name="menuOption" value="Poached Egg" disabled>Poached</label>
                        <label class="radio-lbl disabled" id="lbl-mutton"><input type="radio" name="menuOption" value="Mutton" disabled>Mutton</label>
                    </div>
                </div>
                <button type="submit" class="btn-blue">Save Entry</button>
            </form>
        </div>
    </div>

    <!-- Summary Output Card (Always Expanded) -->
    <div class="card expanded" id="card-summary">
        <h2 onclick="toggleCard('card-summary')"><span>Summary Output</span><span class="toggle-icon" id="icon-summary">▲</span></h2>
        <div class="card-body" style="display: block;">
            <div style="max-width:160px; margin-bottom:6px;"><label>Select Date</label><input type="text" id="s-date"></div>
            <div class="tab-row" id="tab-row"></div>
            <div class="panel show" id="panel-Breakfast"></div>
            <div class="panel" id="panel-Lunch"></div>
            <div class="panel" id="panel-Dinner"></div>
        </div>
    </div>

    <!-- Delete Record Card (Collapsed by default) -->
    <div class="card" id="card-del">
        <h2 onclick="toggleCard('card-del')"><span>Delete Record</span><span class="toggle-icon" id="icon-del">▼</span></h2>
        <div class="card-body">
            <div id="d-msg" class="msg-box"></div>
            <form id="f-del">
                <div class="field-group"><label>ID(s)</label><input type="text" id="d-id" required></div>
                <div class="row">
                    <div><label>Start Date</label><input type="text" id="d-start-date" required></div>
                    <div><label>End Date</label><input type="text" id="d-end-date" required></div>
                </div>
                <div class="field-group"><label>Meal</label><select id="d-meal"><option value="Breakfast">Breakfast</option><option value="Lunch">Lunch</option><option value="Dinner">Dinner</option></select></div>
                <button type="submit" class="btn-red" style="margin-top:6px;">Delete</button>
            </form>
        </div>
    </div>
</div>

<script>
    function fmt(d) {
        return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    }
    function parseIso(str) {
        if (!str || !str.includes('/')) return '';
        const p = str.trim().split('/');
        return p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : '';
    }
    function benNum(n) {
        return String(n).replace(/[0-9]/g, w => ('০১২৩৪৫৬৭৮৯')[w]);
    }

    const todayStr = fmt(new Date());
    ['s-date', 'd-start-date', 'd-end-date', 'e-start-date', 'e-end-date'].forEach(id => {
        document.getElementById(id).value = todayStr;
    });

    // Auto-load saved ID from localStorage
    const savedId = localStorage.getItem('ccr_emp_id') || '';
    ['e-id', 'd-id'].forEach(id => {
        document.getElementById(id).value = savedId;
    });

    // If ID already exists on device, keep Meal Entry collapsed, otherwise expand it
    if (savedId) {
        document.getElementById('card-entry').classList.remove('expanded');
        document.getElementById('icon-entry').innerText = '▼';
    } else {
        document.getElementById('card-entry').classList.add('expanded');
        document.getElementById('icon-entry').innerText = '▲';
    }

    function toggleCard(cardId) {
        const card = document.getElementById(cardId);
        const isExp = card.classList.toggle('expanded');
        const iconId = cardId === 'card-entry' ? 'icon-entry' : (cardId === 'card-summary' ? 'icon-summary' : 'icon-del');
        document.getElementById(iconId).innerText = isExp ? '▲' : '▼';
    }

    ['e-id', 'd-id'].forEach(idInput => {
        document.getElementById(idInput).addEventListener('input', e => {
            const firstId = e.target.value.split(',')[0].trim();
            if (firstId) {
                localStorage.setItem('ccr_emp_id', firstId);
            }
        });
    });

    let activeMeal = 'Breakfast';

    function showMsg(id, txt, type) {
        const el = document.getElementById(id);
        el.className = `msg-box ${type === 'success' ? 'suc-msg' : 'err-msg'}`;
        el.innerText = txt;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 8000);
    }

    ['g-shift', 'g-meal', 'g-menu'].forEach(gid => {
        document.getElementById(gid).addEventListener('change', e => {
            if (e.target.disabled) return;
            const c = document.getElementById(gid);
            c.querySelectorAll('.radio-lbl').forEach(l => l.classList.remove('active'));
            e.target.closest('.radio-lbl').classList.add('active');
        });
    });

    document.querySelectorAll('input[name="meal"]').forEach(inp => {
        inp.addEventListener('change', e => {
            const isB = e.target.value === 'Breakfast';
            ['Fried Egg', 'Poached Egg', 'Mutton'].forEach(val => {
                const el = document.querySelector(`input[value="${val}"]`);
                if (el) {
                    el.disabled = isB;
                    el.closest('.radio-lbl').classList.toggle('disabled', isB);
                }
            });
            if (isB) {
                document.querySelector('input[value="Regular"]').checked = true;
                document.querySelectorAll('#g-menu .radio-lbl').forEach(l => l.classList.remove('active'));
                document.getElementById('lbl-reg').classList.add('active');
            }
        });
    });

    async function loadSummary(prefMeal) {
        if (prefMeal) activeMeal = prefMeal;
        const dateIso = parseIso(document.getElementById('s-date').value);
        if (!dateIso) return;

        try {
            const res = await fetch(`/api/summary?dateStr=${dateIso}`);
            const data = await res.json();
            const records = data.records || [];
            const dateDMY = document.getElementById('s-date').value;

            const meals = ['Breakfast', 'Lunch', 'Dinner'];
            
            let tabHtml = '';
            meals.forEach(m => {
                const count = records.filter(r => r.meal === m).length;
                tabHtml += `<button type="button" class="tab-btn ${m === activeMeal ? 'active' : ''}" onclick="switchTab('${m}')">${m} (${count})</button>`;
            });
            document.getElementById('tab-row').innerHTML = tabHtml;

            meals.forEach(m => {
                const panel = document.getElementById(`panel-${m}`);
                panel.classList.toggle('show', m === activeMeal);

                const mRecs = records.filter(r => r.meal === m);
                if (mRecs.length === 0) {
                    panel.innerHTML = `<div style="color:#64748b; text-align:center; padding: 10px;">No entries found.</div>`;
                    return;
                }

                let bodyHtml = '';
                ['Morning', 'Afternoon', 'Night'].forEach(shift => {
                    const sRecs = mRecs.filter(r => r.shift === shift);
                    if (!sRecs.length) return;
                    const f = sRecs.filter(r => r.menuOption === 'Fried Egg').length;
                    const p = sRecs.filter(r => r.menuOption === 'Poached Egg').length;
                    const mu = sRecs.filter(r => r.menuOption === 'Mutton').length;

                    let cStr = `Total:${sRecs.length}`;
                    if (f) cStr += `, F-${f}`;
                    if (p) cStr += `, P-${p}`;
                    if (mu) cStr += `, M-${mu}`;

                    const ids = sRecs.map(r => r.id + (r.menuOption === 'Poached Egg' ? '(P)' : r.menuOption === 'Fried Egg' ? '(F)' : r.menuOption === 'Mutton' ? '(M)' : '')).join(', ');
                    bodyHtml += `<div class="shift-blk"><div style="font-weight:700; font-size:1.05rem;">${shift} Shift (${cStr})</div><div style="margin-top:4px; font-size:0.95rem;">ID: ${ids}</div></div>`;
                });

                let timeWord = m === 'Breakfast' ? 'সকালে' : (m === 'Lunch' ? 'দুপুরে' : 'রাতে');
                let waText = `${dateDMY}\n${timeWord} মোট ${benNum(mRecs.length)} জনের খাবার\nCCR এ আসবে।\nID: ${mRecs.map(r => r.id).join(', ')}`;
                
                const fr = mRecs.filter(r => r.menuOption === 'Fried Egg');
                if (fr.length) waText += `\nডিম ভাজি: ${benNum(fr.length)} টা\n(${fr.map(r => r.id).join(', ')})`;
                const po = mRecs.filter(r => r.menuOption === 'Poached Egg');
                if (po.length) waText += `\nডিম পোচ: ${benNum(po.length)} টা\n(${po.map(r => r.id).join(', ')})`;
                const mt = mRecs.filter(r => r.menuOption === 'Mutton');
                if (mt.length) waText += `\nখাসি (নন-মুসলিম): ${benNum(mt.length)} টা\n(${mt.map(r => r.id).join(', ')})`;

                bodyHtml += `<div class="txt-pre" id="wa-${m}">${waText}</div>
                <button type="button" class="btn-green" onclick="navigator.clipboard.writeText(document.getElementById('wa-${m}').innerText)">Copy WhatsApp Format</button>`;

                panel.innerHTML = bodyHtml;
            });
        } catch (e) { console.error(e); }
    }

    window.switchTab = function(m) {
        activeMeal = m;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.textContent.startsWith(m)));
        document.querySelectorAll('.panel').forEach(p => p.classList.toggle('show', p.id === `panel-${m}`));
    };

    document.getElementById('f-meal').addEventListener('submit', async e => {
        e.preventDefault();
        const startISO = parseIso(document.getElementById('e-start-date').value);
        const endISO = parseIso(document.getElementById('e-end-date').value);
        if (!startISO || !endISO) return showMsg('e-msg', 'Invalid date format.', 'error');

        const mealType = document.querySelector('input[name="meal"]:checked').value;
        const rawIdVal = document.getElementById('e-id').value;
        const ids = rawIdVal.split(',').map(i => i.trim()).filter(Boolean);
        if (!ids.length) return;

        if (ids[0]) {
            localStorage.setItem('ccr_emp_id', ids[0]);
        }

        let curr = new Date(startISO), end = new Date(endISO);
        while (curr <= end) {
            const dateStr = curr.toISOString().split('T')[0];
            for (let id of ids) {
                await fetch('/api/submit', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        dateStr, id, 
                        shift: document.querySelector('input[name="shift"]:checked').value,
                        meal: mealType,
                        menuOption: document.querySelector('input[name="menuOption"]:checked').value
                    })
                });
            }
            curr.setDate(curr.getDate() + 1);
        }
        document.getElementById('s-date').value = document.getElementById('e-start-date').value;
        showMsg('e-msg', 'Saved successfully!', 'success');
        loadSummary(mealType);
    });

    document.getElementById('f-del').addEventListener('submit', async e => {
        e.preventDefault();
        const startISO = parseIso(document.getElementById('d-start-date').value);
        const endISO = parseIso(document.getElementById('d-end-date').value);
        if (!startISO || !endISO) return showMsg('d-msg', 'Invalid date format.', 'error');

        const rawDelId = document.getElementById('d-id').value;
        const ids = rawDelId.split(',').map(i => i.trim()).filter(Boolean);
        const mealVal = document.getElementById('d-meal').value;

        if (ids[0]) {
            localStorage.setItem('ccr_emp_id', ids[0]);
        }

        let curr = new Date(startISO), end = new Date(endISO);
        while (curr <= end) {
            const dateStr = curr.toISOString().split('T')[0];
            for (let id of ids) {
                await fetch('/api/delete', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id, dateStr, meal: mealVal })
                });
            }
            curr.setDate(curr.getDate() + 1);
        }
        document.getElementById('s-date').value = document.getElementById('d-start-date').value;
        showMsg('d-msg', 'Deleted successfully!', 'success');
        loadSummary(mealVal);
    });

    document.getElementById('e-start-date').addEventListener('input', e => {
        document.getElementById('s-date').value = e.target.value;
        loadSummary();
    });
    document.getElementById('s-date').addEventListener('input', () => loadSummary());

    loadSummary();
</script>
</body>
</html>
