<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR Meal System</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 15px;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            cursor: pointer;
        }

        .radio-label input {
            width: 18px;
            height: 18px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            color: white;
        }

        .btn-primary {
            background-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-secondary {
            background-color: #64748b;
            margin-top: 10px;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #0f172a;
            color: #38bdf8;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
        }

        .status-msg {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            display: none;
            font-size: 0.9rem;
            text-align: center;
        }

        .status-success {
            background-color: #dcfce7;
            color: #166534;
        }

        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- SUBMIT MEAL CARD -->
    <div class="card">
        <h2>Meal Entry</h2>
        <div id="submit-status" class="status-msg"></div>

        <form id="mealForm">
            <div class="form-group">
                <label for="dateStr">Date:</label>
                <input type="date" id="dateStr" required>
            </div>

            <div class="form-group">
                <label for="employeeId">Employee ID:</label>
                <input type="text" id="employeeId" placeholder="e.g. 437" required>
            </div>

            <div class="form-group">
                <label for="shift">Shift:</label>
                <select id="shift" required>
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Night">Night</option>
                </select>
            </div>

            <div class="form-group">
                <label for="meal">Meal Type:</label>
                <select id="meal" required>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                </select>
            </div>

            <div class="form-group">
                <label>Preferred Menu Option:</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="menuOption" value="None" checked> Regular Menu (None)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="menuOption" value="Fried Egg"> Fried Egg (F)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="menuOption" value="Poached Egg"> Poached Egg (P)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="menuOption" value="Mutton"> Mutton (M)
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Submit Meal Entry</button>
        </form>
    </div>

    <!-- DELETE RECORD CARD -->
    <div class="card">
        <h2>Delete Record</h2>
        <div id="delete-status" class="status-msg"></div>

        <form id="deleteForm">
            <div class="form-group">
                <label for="deleteDateStr">Date:</label>
                <input type="date" id="deleteDateStr" required>
            </div>

            <div class="form-group">
                <label for="deleteId">Employee ID to Delete:</label>
                <input type="text" id="deleteId" placeholder="e.g. 437" required>
            </div>

            <div class="form-group">
                <label for="deleteMeal">Meal Type:</label>
                <select id="deleteMeal" required>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                </select>
            </div>

            <button type="submit" class="btn-danger" id="deleteBtn">Delete Record</button>
        </form>
    </div>

    <!-- SUMMARY & OUTPUT CARD -->
    <div class="card">
        <h2>Summary Output</h2>
        <div class="form-group">
            <label for="summaryDate">Select Date for Summary:</label>
            <input type="date" id="summaryDate">
        </div>
        <button type="button" class="btn-primary" id="getSummaryBtn">Generate Summary</button>

        <div style="margin-top: 15px;">
            <pre id="summaryOutput">Select a date and click 'Generate Summary'...</pre>
        </div>
    </div>

</div>

<script>
    // Set default date to today for all date pickers
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('dateStr').value = today;
    document.getElementById('deleteDateStr').value = today;
    document.getElementById('summaryDate').value = today;

    function showStatus(elementId, message, isSuccess) {
        const el = document.getElementById(elementId);
        el.innerText = message;
        el.className = 'status-msg ' + (isSuccess ? 'status-success' : 'status-error');
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    // Submit Entry Handler
    document.getElementById('mealForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Saving...';

        const payload = {
            dateStr: document.getElementById('dateStr').value,
            id: document.getElementById('employeeId').value.trim(),
            shift: document.getElementById('shift').value,
            meal: document.getElementById('meal').value,
            menuOption: document.querySelector('input[name="menuOption"]:checked').value
        };

        try {
            const res = await fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                showStatus('submit-status', 'Entry saved successfully!', true);
                document.getElementById('employeeId').value = '';
            } else {
                showStatus('submit-status', 'Error: ' + (data.error || 'Failed to save'), false);
            }
        } catch (err) {
            showStatus('submit-status', 'Network connection error.', false);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Submit Meal Entry';
        }
    });

    // Delete Record Handler
    document.getElementById('deleteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const deleteBtn = document.getElementById('deleteBtn');
        deleteBtn.disabled = true;
        deleteBtn.innerText = 'Deleting...';

        const payload = {
            dateStr: document.getElementById('deleteDateStr').value,
            id: document.getElementById('deleteId').value.trim(),
            meal: document.getElementById('deleteMeal').value
        };

        try {
            const res = await fetch('/api/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                showStatus('delete-status', 'Record deleted successfully!', true);
                document.getElementById('deleteId').value = '';
            } else {
                showStatus('delete-status', data.message || 'Record not found.', false);
            }
        } catch (err) {
            showStatus('delete-status', 'Network connection error.', false);
        } finally {
            deleteBtn.disabled = false;
            deleteBtn.innerText = 'Delete Record';
        }
    });

    // Generate Summary Handler
    document.getElementById('getSummaryBtn').addEventListener('click', async () => {
        const date = document.getElementById('summaryDate').value;
        const outputEl = document.getElementById('summaryOutput');
        outputEl.innerText = 'Loading summary...';

        try {
            const res = await fetch(`/api/summary?date=${date}`);
            const data = await res.json();

            let textOutput = '';
            for (const mealType in data) {
                textOutput += data[mealType].text + '\n\n' + '='.repeat(30) + '\n\n';
            }

            outputEl.innerText = textOutput.trim() || 'No meal records found for this date.';
        } catch (err) {
            outputEl.innerText = 'Error fetching summary data.';
        }
    });
</script>

</body>
</html>
