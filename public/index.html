<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR Meal System</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --danger: #ef4444;
            --success: #059669;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
        .subtitle { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
        
        input[type="text"], input[type="date"] {
            width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; outline: none; background: #f8fafc;
        }
        input:focus { border-color: var(--primary); background: #fff; }

        .option-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .option-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }

        .radio-btn {
            display: flex; align-items: center; justify-content: center; padding: 8px 4px;
            background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius);
            font-size: 0.8rem; font-weight: 600; cursor: pointer; color: var(--text-muted); text-align: center;
        }
        .radio-btn input { display: none; }
        
        /* Unified Blue Theme for Checked state */
        .radio-btn.checked {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        button { width: 100%; padding: 10px; border: none; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-top: 4px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; padding: 4px 8px; font-size: 0.75rem; width: auto; }
        .btn-danger { background: var(--danger); color: white; padding: 4px 8px; font-size: 0.75rem; width: auto; }

        .status-msg { padding: 8px; border-radius: var(--radius); margin-bottom: 10px; display: none; font-size: 0.85rem; }
        .status-success { background: #dcfce7; color: #15803d; }
        .status-error { background: #fee2e2; color: #991b1b; }

        .summary-box { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin-top: 8px; font-size: 0.85rem; }
        .summary-header { font-weight: 700; color: var(--primary); margin-bottom: 6px; display: flex; justify-content: space-between; }
        .id-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #eee; }
        .id-row:last-child { border-bottom: none; }
        .code-box { font-family: monospace; background: #fff; padding: 6px; border: 1px solid var(--border); font-size: 0.75rem; white-space: pre-wrap; margin: 4px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- MEAL ENTRY CARD -->
    <div class="card">
        <h2>Meal Entry</h2>
        <div class="subtitle">Log daily meal counts</div>
        <div id="submit-status" class="status-msg"></div>

        <form id="mealForm">
            <div class="form-row">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Employee ID</label>
                    <input type="text" id="employeeId" placeholder="e.g. 437" required>
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Date</label>
                    <input type="date" id="dateStr" required>
                </div>
            </div>

            <div class="form-group" style="margin-top:10px;">
                <label>Shift</label>
                <div class="option-grid" id="shiftGroup">
                    <label class="radio-btn checked"><input type="radio" name="shift" value="Morning" checked>Morning</label>
                    <label class="radio-btn"><input type="radio" name="shift" value="Afternoon">Afternoon</label>
                    <label class="radio-btn"><input type="radio" name="shift" value="Night">Night</label>
                </div>
            </div>

            <div class="form-group">
                <label>Meal Type</label>
                <div class="option-grid" id="mealGroup">
                    <label class="radio-btn checked"><input type="radio" name="meal" value="Breakfast" checked>Breakfast</label>
                    <label class="radio-btn"><input type="radio" name="meal" value="Lunch">Lunch</label>
                    <label class="radio-btn"><input type="radio" name="meal" value="Dinner">Dinner</label>
                </div>
            </div>

            <div class="form-group">
                <label>Menu Option</label>
                <div class="option-grid-4" id="menuGroup">
                    <label class="radio-btn checked"><input type="radio" name="menuOption" value="Regular" checked>Reg</label>
                    <label class="radio-btn"><input type="radio" name="menuOption" value="Fried">Fried</label>
                    <label class="radio-btn"><input type="radio" name="menuOption" value="Poached">Poach</label>
                    <label class="radio-btn"><input type="radio" name="menuOption" value="Mutton">Mutton</label>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Save Entry</button>
        </form>
    </div>

    <!-- SUMMARY SECTION -->
    <div class="card">
        <h2>Summary Output</h2>
        <div class="form-group" style="margin-top:8px;">
            <label>Select Date</label>
            <input type="date" id="summaryDate">
        </div>
        <div id="summaryContainer"></div>
    </div>
</div>

<script>
    // Simple helper to manage radio button active styling without modern CSS dependencies
    function setupRadioGroup(groupId) {
        const container = document.getElementById(groupId);
        container.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                container.querySelectorAll('.radio-btn').forEach(lbl => lbl.classList.remove('checked'));
                e.target.closest('.radio-btn').classList.add('checked');
            });
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateStr').value = today;
        document.getElementById('summaryDate').value = today;

        setupRadioGroup('shiftGroup');
        setupRadioGroup('mealGroup');
        setupRadioGroup('menuGroup');

        loadSummary();

        document.getElementById('dateStr').addEventListener('input', (e) => {
            document.getElementById('summaryDate').value = e.target.value;
            loadSummary();
        });
        document.getElementById('summaryDate').addEventListener('input', loadSummary);
    });

    function showStatus(msg, success) {
        const el = document.getElementById('submit-status');
        el.innerText = msg;
        el.className = 'status-msg ' + (success ? 'status-success' : 'status-error');
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }

    document.getElementById('mealForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = 'Saving...';

        const payload = {
            dateStr: document.getElementById('dateStr').value,
            id: document.getElementById('employeeId').value.trim(),
            shift: document.querySelector('input[name="shift"]:checked').value,
            meal: document.querySelector('input[name="meal"]:checked').value,
            menuOption: document.querySelector('input[name="menuOption"]:checked').value
        };

        try {
            const res = await fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                showStatus('Saved successfully!', true);
                document.getElementById('employeeId').value = '';
                document.getElementById('summaryDate').value = payload.dateStr;
                loadSummary();
            } else {
                showStatus(data.error || 'Failed to save', false);
            }
        } catch (err) {
            showStatus('Network error', false);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Save Entry';
        }
    });

    async function loadSummary() {
        const dateStr = document.getElementById('summaryDate').value;
        const container = document.getElementById('summaryContainer');
        try {
            const res = await fetch(`/api/summary?dateStr=${dateStr}`);
            const data = await res.json();
            const records = data.records || [];

            let html = '';
            ['Breakfast', 'Lunch', 'Dinner'].forEach(meal => {
                const mealRecs = records.filter(r => r.meal === meal);
                html += `<div class="summary-box"><div class="summary-header"><span>${meal}</span><span>${mealRecs.length} entries</span></div>`;
                
                if (mealRecs.length === 0) {
                    html += `<div style="font-size:0.75rem; color:#64748b;">No entries</div>`;
                } else {
                    ['Morning', 'Afternoon', 'Night'].forEach(shift => {
                        const shiftRecs = mealRecs.filter(r => r.shift === shift);
                        if (shiftRecs.length > 0) {
                            const idsStr = shiftRecs.map(r => r.menuOption !== 'Regular' ? `${r.id}(${r.menuOption[0]})` : r.id).join(', ');
                            const textToCopy = `Date : ${dateStr} ${meal}\nMeal ID: ${idsStr}\nTotal: ${shiftRecs.length}`;
                            
                            html += `<div style="margin-top:6px; font-weight:600; font-size:0.75rem;">${shift} Shift</div>`;
                            html += `<div class="code-box">${textToCopy}</div>`;
                            html += `<button type="button" class="btn-success" onclick="navigator.clipboard.writeText(this.previousElementSibling.innerText)">Copy</button>`;
                            
                            shiftRecs.forEach(rec => {
                                html += `<div class="id-row"><span style="font-size:0.8rem;">ID: <b>${rec.id}</b> (${rec.menuOption})</span><button type="button" class="btn-danger" onclick="deleteRec('${rec.id}', '${dateStr}', '${meal}')">Del</button></div>`;
                            });
                        }
                    });
                }
                html += `</div>`;
            });
            container.innerHTML = html;
        } catch (err) {
            container.innerHTML = 'Error loading summary.';
        }
    }

    async function deleteRec(id, dateStr, meal) {
        if (!confirm(`Delete ID ${id}?`)) return;
        await fetch('/api/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, dateStr, meal })
        });
        loadSummary();
    }
</script>
</body>
</html>
