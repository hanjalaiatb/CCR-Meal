<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR Meal System</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 8px; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; }
        .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; padding: 10px; }
        h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; }
        .sub { font-size: 0.7rem; color: #64748b; margin-bottom: 6px; }
        
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
        .row-3 { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 6px; margin-bottom: 6px; align-items: end; }
        .group { margin-bottom: 6px; }
        label { display: block; font-size: 0.65rem; font-weight: 600; color: #64748b; margin-bottom: 2px; text-transform: uppercase; }
        
        input, select { width: 100%; height: 30px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 3px; font-size: 0.8rem; background: #f8fafc; box-sizing: border-box; }
        input:focus, select:focus { border-color: #2563eb; background: #fff; outline: none; }
        
        .date-short { max-width: 130px; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
        
        .radio-lbl {
            display: flex; align-items: center; justify-content: center; height: 30px; padding: 0 2px;
            background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 3px;
            font-size: 0.7rem; font-weight: 600; cursor: pointer; color: #64748b; text-align: center; box-sizing: border-box;
        }
        .radio-lbl input { display: none; }
        .radio-lbl.active { background: #eff6ff; border-color: #2563eb; color: #2563eb; }
        .radio-lbl.disabled { opacity: 0.3; cursor: not-allowed; background: #f1f5f9; }

        button { width: 100%; height: 30px; border: none; border-radius: 3px; font-size: 0.8rem; font-weight: 600; cursor: pointer; margin-top: 3px; box-sizing: border-box; }
        .btn-blue { background: #2563eb; color: #fff; }
        .btn-red { background: #ef4444; color: #fff; }
        .btn-green { background: #059669; color: #fff; height: 26px; padding: 0 8px; font-size: 0.7rem; width: auto; margin-top: 4px; display: inline-block; }

        .msg { padding: 5px; border-radius: 3px; margin-bottom: 6px; display: none; font-size: 0.75rem; }
        .msg-ok { background: #dcfce7; color: #15803d; }
        .msg-err { background: #fee2e2; color: #991b1b; }

        .acc { border: 1px solid #cbd5e1; border-radius: 3px; margin-top: 5px; overflow: hidden; background: #fff; }
        .acc-btn { width: 100%; padding: 7px 8px; background: #f8fafc; border: none; display: flex; justify-content: space-between; font-weight: 700; color: #2563eb; font-size: 0.8rem; cursor: pointer; text-align: left; align-items: center; }
        .acc-body { display: none; padding: 6px; border-top: 1px solid #cbd5e1; font-size: 0.75rem; }
        .acc-body.show { display: block; }

        .shift-blk { margin-top: 4px; padding-top: 3px; border-top: 1px dashed #cbd5e1; }
        .shift-title { font-weight: 700; font-size: 0.73rem; text-transform: uppercase; margin-bottom: 1px; }
        .txt-pre { font-family: monospace; background: #f8fafc; padding: 5px; border: 1px solid #cbd5e1; border-radius: 3px; font-size: 0.7rem; white-space: pre-wrap; line-height: 1.3; margin-top: 3px; }
        .log-row { font-size: 0.68rem; padding: 2px 0; border-bottom: 1px solid #f1f5f9; color: #64748b; }
    </style>
</head>
<body>

<div class="box">
    <!-- 1. MEAL ENTRY -->
    <div class="card">
        <h2>Meal Entry</h2>
        <div class="sub">Log daily meal counts</div>
        <div id="s-msg" class="msg"></div>
        <form id="f-meal">
            <div class="row-2">
                <div class="group" style="margin-bottom:0;">
                    <label>Employee ID</label>
                    <input type="text" id="e-id" required>
                </div>
                <div class="group" style="margin-bottom:0;">
                    <label>Date</label>
                    <input type="date" id="e-date" required>
                </div>
            </div>
            <div class="group" style="margin-top:6px;">
                <label>Shift</label>
                <div class="grid-3" id="g-shift">
                    <label class="radio-lbl active"><input type="radio" name="shift" value="Morning" checked>Morning</label>
                    <label class="radio-lbl"><input type="radio" name="shift" value="Afternoon">Afternoon</label>
                    <label class="radio-lbl"><input type="radio" name="shift" value="Night">Night</label>
                </div>
            </div>
            <div class="group">
                <label>Meal Type</label>
                <div class="grid-3" id="g-meal">
                    <label class="radio-lbl active"><input type="radio" name="meal" value="Breakfast" checked>Breakfast</label>
                    <label class="radio-lbl"><input type="radio" name="meal" value="Lunch">Lunch</label>
                    <label class="radio-lbl"><input type="radio" name="meal" value="Dinner">Dinner</label>
                </div>
            </div>
            <div class="group">
                <label>Menu Option</label>
                <div class="grid-4" id="g-menu">
                    <label class="radio-lbl active" id="lbl-reg"><input type="radio" name="menuOption" value="Regular" checked>Reg</label>
                    <label class="radio-lbl disabled" id="lbl-fried"><input type="radio" name="menuOption" value="Fried Egg" disabled>Fried</label>
                    <label class="radio-lbl disabled" id="lbl-poached"><input type="radio" name="menuOption" value="Poached Egg" disabled>Poached</label>
                    <label class="radio-lbl disabled" id="lbl-mutton"><input type="radio" name="menuOption" value="Mutton" disabled>Mutton</label>
                </div>
            </div>
            <button type="submit" class="btn-blue" id="btn-save">Save Entry</button>
        </form>
    </div>

    <!-- 2. DELETE RECORD -->
    <div class="card">
        <h2>Delete Specific Record</h2>
        <div class="sub">Remove entry by Date, Meal, and ID</div>
        <div id="d-msg" class="msg"></div>
        <form id="f-del">
            <div class="row-3">
                <div class="group" style="margin-bottom:0;">
                    <label>Date</label>
                    <input type="date" id="d-date" required>
                </div>
                <div class="group" style="margin-bottom:0;">
                    <label>Meal Type</label>
                    <select id="d-meal" required>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                    </select>
                </div>
                <div class="group" style="margin-bottom:0;">
                    <label>Select ID</label>
                    <select id="d-id-select" required>
                        <option value="">-- ID --</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-red" style="margin-top:6px;">Delete Record</button>
        </form>
    </div>

    <!-- 3. SUMMARY -->
    <div class="card">
        <h2>Summary Output</h2>
        <div class="group date-short" style="margin-top:5px;">
            <label>Select Date</label>
            <input type="date" id="s-date">
        </div>
        <div id="summary-box"></div>
    </div>

    <!-- 4. AUDIT LOG -->
    <div class="card">
        <h2>Activity Audit Log</h2>
        <div class="sub">Tracks updates & deletions</div>
        <div id="log-box" style="max-height:80px; overflow-y:auto;">
            <div style="font-size:0.7rem; color:#64748b;">No actions recorded yet.</div>
        </div>
    </div>
</div>

<script>
    let records = [];
    let logs = [];

    function bindRadios(groupId) {
        const c = document.getElementById(groupId);
        c.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('change', e => {
                if (e.target.disabled) return;
                c.querySelectorAll('.radio-lbl').forEach(l => l.classList.remove('active'));
                e.target.closest('.radio-lbl').classList.add('active');
            });
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('e-date').value = today;
        document.getElementById('s-date').value = today;
        document.getElementById('d-date').value = today;

        bindRadios('g-shift');
        bindRadios('g-meal');
        bindRadios('g-menu');

        document.querySelectorAll('input[name="meal"]').forEach(inp => {
            inp.addEventListener('change', e => {
                const isBreakfast = e.target.value === 'Breakfast';
                const friedInp = document.querySelector('input[value="Fried Egg"]');
                const poachedInp = document.querySelector('input[value="Poached Egg"]');
                const muttonInp = document.querySelector('input[value="Mutton"]');
                const regInp = document.querySelector('input[value="Regular"]');

                [friedInp, poachedInp, muttonInp].forEach(el => {
                    el.disabled = isBreakfast;
                    const lbl = el.closest('.radio-lbl');
                    if (isBreakfast) {
                        lbl.classList.add('disabled');
                        lbl.classList.remove('active');
                    } else {
                        lbl.classList.remove('disabled');
                    }
                });

                if (isBreakfast) {
                    regInp.checked = true;
                    document.querySelectorAll('#g-menu .radio-lbl').forEach(l => l.classList.remove('active'));
                    document.getElementById('lbl-reg').classList.add('active');
                }
            });
        });

        loadData('Breakfast');

        document.getElementById('e-date').addEventListener('input', e => {
            document.getElementById('s-date').value = e.target.value;
            document.getElementById('d-date').value = e.target.value;
            loadData();
        });
        document.getElementById('s-date').addEventListener('input', () => loadData());
        document.getElementById('d-date').addEventListener('input', updateDelDropdown);
        document.getElementById('d-meal').addEventListener('change', updateDelDropdown);
    });

    function showMsg(id, text, ok) {
        const el = document.getElementById(id);
        el.innerText = text;
        el.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2000);
    }

    document.getElementById('f-meal').addEventListener('submit', async e => {
        e.preventDefault();
        const payload = {
            dateStr: document.getElementById('e-date').value,
            id: document.getElementById('e-id').value.trim(),
            shift: document.querySelector('input[name="shift"]:checked').value,
            meal: document.querySelector('input[name="meal"]:checked').value,
            menuOption: document.querySelector('input[name="menuOption"]:checked').value
        };

        const res = await fetch('/api/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
            const action = data.isNew ? 'Added' : 'Updated';
            showMsg('s-msg', 'Saved successfully!', true);
            addLog(`${action}: ID ${payload.id} (${payload.meal})`);
            document.getElementById('e-id').value = '';
            document.getElementById('s-date').value = payload.dateStr;
            document.getElementById('d-date').value = payload.dateStr;
            loadData(payload.meal);
        } else {
            showMsg('s-msg', data.error || 'Error', false);
        }
    });

    document.getElementById('f-del').addEventListener('submit', async e => {
        e.preventDefault();
        const id = document.getElementById('d-id-select').value;
        const dateStr = document.getElementById('d-date').value;
        const meal = document.getElementById('d-meal').value;

        if (!id) return;
        const res = await fetch('/api/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, dateStr, meal })
        });
        const data = await res.json();
        if (res.ok && data.success) {
            showMsg('d-msg', `Deleted ID ${id}`, true);
            addLog(`Deleted: ID ${id} (${meal})`);
            loadData(meal);
        } else {
            showMsg('d-msg', 'Delete failed', false);
        }
    });

    async function loadData(openMeal = null) {
        const dateStr = document.getElementById('s-date').value;
        const res = await fetch(`/api/summary?dateStr=${dateStr}`);
        const data = await res.json();
        records = data.records || [];
        renderSummary(dateStr, openMeal);
        updateDelDropdown();
    }

    function updateDelDropdown() {
        const dDate = document.getElementById('d-date').value;
        const dMeal = document.getElementById('d-meal').value;
        const sel = document.getElementById('d-id-select');
        sel.innerHTML = '<option value="">-- ID --</option>';
        records.filter(r => r.dateStr === dDate && r.meal === dMeal).forEach(r => {
            const opt = document.createElement('option');
            opt.value = r.id;
            opt.textContent = r.id;
            sel.appendChild(opt);
        });
    }

    function renderSummary(dateStr, openMeal) {
        const box = document.getElementById('summary-box');
        let html = '';

        ['Breakfast', 'Lunch', 'Dinner'].forEach(meal => {
            const mRecs = records.filter(r => r.meal === meal);
            const isOpen = (meal === openMeal);

            html += `
                <div class="acc">
                    <button type="button" class="acc-btn" onclick="toggleAcc('${meal}')">
                        <span>${meal}</span><span id="arrow-${meal}">Total: ${mRecs.length} ${isOpen ? '▲' : '▼'}</span>
                    </button>
                    <div class="acc-body ${isOpen ? 'show' : ''}" id="acc-${meal}">
            `;

            if (mRecs.length === 0) {
                html += `<div>No entries found.</div>`;
            } else {
                ['Morning', 'Afternoon', 'Night'].forEach(shift => {
                    const sRecs = mRecs.filter(r => r.shift === shift);
                    if (sRecs.length > 0) {
                        const idsShort = sRecs.map(r => {
                            if (r.menuOption === 'Poached Egg') return `${r.id}(P)`;
                            if (r.menuOption === 'Fried Egg') return `${r.id}(F)`;
                            if (r.menuOption === 'Mutton') return `${r.id}(M)`;
                            return r.id;
                        }).join(', ');

                        const counts = {};
                        sRecs.forEach(r => {
                            if (r.menuOption === 'Poached Egg') counts['P'] = (counts['P'] || 0) + 1;
                            else if (r.menuOption === 'Fried Egg') counts['F'] = (counts['F'] || 0) + 1;
                            else if (r.menuOption === 'Mutton') counts['M'] = (counts['M'] || 0) + 1;
                        });
                        
                        let countParts = Object.entries(counts).map(([k,v]) => `${k}-${v}`);
                        countParts.push(`Total-${sRecs.length}`);
                        const countStr = countParts.join(', ');

                        html += `
                            <div class="shift-blk">
                                <div class="shift-title">${shift} shift</div>
                                <div>Meal ID: ${idsShort}</div>
                                <div>Meal count: ${countStr}</div>
                            </div>
                        `;
                    }
                });

                let waIds = mRecs.map(r => r.id).join(', ');
                let wa = `${meal} Meal from CCR on ${dateStr}\nID: ${waIds}\nTotal Meal Count: ${mRecs.length}`;
                
                ['Poached Egg', 'Fried Egg', 'Mutton'].forEach(opt => {
                    const sub = mRecs.filter(r => r.menuOption === opt);
                    if (sub.length > 0) wa += `\n${opt}: ${sub.length} (${sub.map(r => r.id).join(', ')})`;
                });

                html += `
                    <div style="margin-top:6px; border-top:1px solid #cbd5e1; padding-top:4px;">
                        <div style="font-size:0.65rem; font-weight:700; color:#64748b;">WHATSAPP FORMAT:</div>
                        <div class="txt-pre" id="wa-${meal}">${wa}</div>
                        <button type="button" class="btn-green" onclick="navigator.clipboard.writeText(document.getElementById('wa-${meal}').innerText).then(()=>alert('Copied!'))">Copy WhatsApp Format</button>
                    </div>
                `;
            }
            html += `</div></div>`;
        });
        box.innerHTML = html;
    }

    function toggleAcc(meal) {
        const el = document.getElementById(`acc-${meal}`);
        const show = el.classList.contains('show');
        document.querySelectorAll('.acc-body').forEach(b => b.classList.remove('show'));
        
        // Reset all arrows to downward
        ['Breakfast', 'Lunch', 'Dinner'].forEach(m => {
            const btnSpan = document.querySelector(`button[onclick="toggleAcc('${m}')"] span:last-child`);
            if (btnSpan) {
                const totalText = btnSpan.innerText.replace(/[▲▼]/g, '').trim();
                btnSpan.innerText = totalText + ' ▼';
            }
        });

        if (!show) {
            el.classList.add('show');
            const activeSpan = document.querySelector(`button[onclick="toggleAcc('${meal}')"] span:last-child`);
            if (activeSpan) {
                const totalText = activeSpan.innerText.replace(/[▲▼]/g, '').trim();
                activeSpan.innerText = totalText + ' ▲';
            }
        }
    }

    function addLog(text) {
        const time = new Date().toLocaleTimeString();
        logs.unshift(`[${time}] ${text}`);
        if (logs.length > 8) logs.pop();
        document.getElementById('log-box').innerHTML = logs.map(l => `<div class="log-row">${l}</div>`).join('');
    }
</script>
</body>
</html>
