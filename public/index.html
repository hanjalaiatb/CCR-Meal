<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR Meal System</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --success: #059669;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;

            /* Meal Themes */
            --breakfast-accent: #d97706;
            --breakfast-bg: #fffbeb;
            --breakfast-border: #fde68a;

            --lunch-accent: #059669;
            --lunch-bg: #ecfdf5;
            --lunch-border: #a7f3d0;

            --dinner-accent: #4f46e5;
            --dinner-bg: #eef2ff;
            --dinner-border: #c7d2fe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 24px 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        .card-header-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* 2-COLUMN GRID LAYOUT */
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 14px;
        }

        .form-group {
            margin-top: 14px;
        }

        .form-row .form-group {
            margin-top: 0;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            color: var(--text-main);
            outline: none;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            background-color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .radio-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .radio-card {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .radio-card:has(input:checked) {
            background: var(--primary-light);
            border-color: #93c5fd;
            color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease;
            margin-top: 16px;
        }

        button:active { opacity: 0.85; }

        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; margin-top: 10px; }
        .btn-subtle {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 12px;
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
        }

        .collapsible-body {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .collapsible-body.open { display: block; }

        .status-msg {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            display: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-success { background: #dcfce7; color: #15803d; }
        .status-error { background: var(--danger-light); color: #991b1b; }

        /* THEMED ACCORDIONS */
        .summary-accordion {
            border-radius: var(--radius-md);
            margin-top: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .theme-Breakfast { border-color: var(--breakfast-border); }
        .theme-Breakfast .accordion-btn { background: var(--breakfast-bg); color: var(--breakfast-accent); }

        .theme-Lunch { border-color: var(--lunch-border); }
        .theme-Lunch .accordion-btn { background: var(--lunch-bg); color: var(--lunch-accent); }

        .theme-Dinner { border-color: var(--dinner-border); }
        .theme-Dinner .accordion-btn { background: var(--dinner-bg); color: var(--dinner-accent); }

        .accordion-btn {
            width: 100%;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 14px 16px;
            text-align: left;
            border: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0;
            cursor: pointer;
        }

        .accordion-content {
            display: none;
            padding: 16px;
            background: #ffffff;
            border-top: 1px solid var(--border);
        }

        .accordion-content.active { display: block; }

        .shift-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 12px 0 6px 0;
        }

        .id-list {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .count-line {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.88rem;
        }

        .count-badge {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
        }

        .tag-fried { background-color: #dcfce7; color: #166534; }
        .tag-poached { background-color: #dbeafe; color: #1e40af; }
        .tag-mutton { background-color: #f3e8ff; color: #6b21a8; }
        .tag-total { background-color: #e2e8f0; color: #334155; }

        .copy-section-wrapper {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }

        .copy-text-box {
            white-space: pre-wrap;
            background: #f8fafc;
            color: #334155;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            border: 1px solid var(--border);
            line-height: 1.5;
            margin-top: 8px;
        }

        .toggle-icon {
            font-size: 0.8rem;
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. MEAL ENTRY CARD -->
    <div class="card">
        <h2>Meal Entry</h2>
        <div class="subtitle">Log daily meal counts by employee shift</div>
        <div id="submit-status" class="status-msg"></div>

        <form id="mealForm">
            <!-- Row 1: ID & Date -->
            <div class="form-row">
                <div class="form-group">
                    <label for="employeeId">Employee ID</label>
                    <input type="text" id="employeeId" placeholder="e.g. 437" required>
                </div>

                <div class="form-group">
                    <label for="dateStr">Date</label>
                    <input type="date" id="dateStr" required>
                </div>
            </div>

            <!-- Row 2: Shift & Meal -->
            <div class="form-row">
                <div class="form-group">
                    <label for="shift">Shift</label>
                    <select id="shift" required>
                        <option value="Morning">Morning Shift</option>
                        <option value="Afternoon">Afternoon Shift</option>
                        <option value="Night">Night Shift</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="meal">Meal Type</label>
                    <select id="meal" required>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Menu Option</label>
                <div class="radio-grid">
                    <label class="radio-card">
                        <input type="radio" name="menuOption" value="None" checked> Regular
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="menuOption" value="Fried Egg"> Fried (F)
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="menuOption" value="Poached Egg"> Poached (P)
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="menuOption" value="Mutton"> Mutton (M)
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Save Entry</button>
        </form>
    </div>

    <!-- 2. SUMMARY OUTPUT SECTION -->
    <div class="card">
        <h2>Summary Output</h2>
        <div class="subtitle">Overview of shift meal totals</div>

        <div class="form-group">
            <label for="summaryDate">Select Date</label>
            <input type="date" id="summaryDate">
        </div>

        <div id="summaryContainer"></div>
    </div>

    <!-- 3. EXPANDABLE MODIFY & DELETE RECORD CARD (PLACED AT LAST) -->
    <div class="card">
        <div class="card-header-toggle" onclick="toggleCardSection('modifyBody', 'modifyIcon')">
            <div>
                <h2>Modify & Delete Record</h2>
                <div class="subtitle">Remove or adjust existing entries</div>
            </div>
            <span class="toggle-icon" id="modifyIcon">▼</span>
        </div>

        <div id="modifyBody" class="collapsible-body">
            <div id="delete-status" class="status-msg"></div>

            <form id="deleteForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="deleteId">Employee ID</label>
                        <input type="text" id="deleteId" placeholder="e.g. 437" required>
                    </div>

                    <div class="form-group">
                        <label for="deleteDateStr">Date</label>
                        <input type="date" id="deleteDateStr" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="deleteMeal">Meal Type</label>
                    <select id="deleteMeal" required>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                    </select>
                </div>

                <button type="submit" class="btn-danger" id="deleteBtn">Delete Record</button>
            </form>
        </div>
    </div>

</div>

<script>
    const rawDataStore = {};

    // Helper: Synchronize all date pickers across the app
    function syncAllDates(dateVal) {
        if (!dateVal) return;
        document.getElementById('dateStr').value = dateVal;
        document.getElementById('summaryDate').value = dateVal;
        document.getElementById('deleteDateStr').value = dateVal;
    }

    // 1. Initialize default date to TODAY for all pickers
    const today = new Date().toISOString().split('T')[0];
    syncAllDates(today);

    // 2. Automatic date sync listeners across all fields
    document.getElementById('dateStr').addEventListener('change', (e) => {
        syncAllDates(e.target.value);
        loadSummary();
    });

    document.getElementById('summaryDate').addEventListener('change', (e) => {
        syncAllDates(e.target.value);
        loadSummary();
    });

    document.getElementById('deleteDateStr').addEventListener('change', (e) => {
        syncAllDates(e.target.value);
        loadSummary();
    });

    function toggleCardSection(bodyId, iconId) {
        const body = document.getElementById(bodyId);
        const icon = document.getElementById(iconId);
        body.classList.toggle('open');
        icon.innerText = body.classList.contains('open') ? '▲' : '▼';
    }

    function showStatus(elementId, message, isSuccess) {
        const el = document.getElementById(elementId);
        el.innerText = message;
        el.className = 'status-msg ' + (isSuccess ? 'status-success' : 'status-error');
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    // Meal Submit Handler
    document.getElementById('mealForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Saving...';

        const selectedMeal = document.getElementById('meal').value;
        const entryDate = document.getElementById('dateStr').value;

        const payload = {
            dateStr: entryDate,
            id: document.getElementById('employeeId').value.trim(),
            shift: document.getElementById('shift').value,
            meal: selectedMeal,
            menuOption: document.querySelector('input[name="menuOption"]:checked').value
        };

        try {
            const res = await fetch('/api/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                showStatus('submit-status', 'Entry saved successfully!', true);
                document.getElementById('employeeId').value = '';
                
                syncAllDates(entryDate);
                loadSummary(selectedMeal);
            } else {
                showStatus('submit-status', 'Error: ' + (data.error || 'Failed to save'), false);
            }
        } catch (err) {
            showStatus('submit-status', 'Network connection error.', false);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Save Entry';
        }
    });

    // Delete Record Handler
    document.getElementById('deleteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const deleteBtn = document.getElementById('deleteBtn');
        deleteBtn.disabled = true;
        deleteBtn.innerText = 'Deleting...';

        const deleteMeal = document.getElementById('deleteMeal').value;
        const deleteDate = document.getElementById('deleteDateStr').value;

        const payload = {
            dateStr: deleteDate,
            id: document.getElementById('deleteId').value.trim(),
            meal: deleteMeal
        };

        try {
            const res = await fetch('/api/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (data.success) {
                showStatus('delete-status', 'Record deleted successfully!', true);
                document.getElementById('deleteId').value = '';

                syncAllDates(deleteDate);
                loadSummary(deleteMeal);
            } else {
                showStatus('delete-status', data.message || 'Record not found.', false);
            }
        } catch (err) {
            showStatus('delete-status', 'Network connection error.', false);
        } finally {
            deleteBtn.disabled = false;
            deleteBtn.innerText = 'Delete Record';
        }
    });

    // Load and Render Accordion Summary
    async function loadSummary(expandMeal = null) {
        const date = document.getElementById('summaryDate').value;
        const container = document.getElementById('summaryContainer');
        container.innerHTML = '<p style="margin-top:12px; font-size:0.85rem; color:var(--text-muted);">Updating summary...</p>';

        try {
            const res = await fetch(`/api/summary?date=${date}`);
            const data = await res.json();
            container.innerHTML = '';

            const allMeals = ['Breakfast', 'Lunch', 'Dinner'];

            allMeals.forEach(mealType => {
                const mealData = data[mealType];
                const isTargetToExpand = expandMeal === mealType;
                
                let contentInnerHtml = '';

                if (mealData) {
                    const rawText = mealData.text;
                    rawDataStore[mealType] = rawText;

                    const parts = rawText.split("Copy section:");
                    const shiftSection = parts[0] || "";
                    const copySection = parts[1] ? "Copy section:" + parts[1] : "";

                    let shiftHtml = shiftSection
                        .replace(/(Breakfast Summary|Lunch Summary|Dinner Summary)/g, '')
                        .replace(/(Morning Shift|Afternoon Shift|Night Shift)/g, '<div class="shift-title">📍 $1</div>')
                        .replace(/(All Shift)/g, '<div class="shift-title" style="color:var(--text-main); margin-top:14px;">🌐 $1</div>')
